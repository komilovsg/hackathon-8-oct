<!doctype html>
<html lang="tg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1C1530">
<title>Шоҳид</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Display:wdth,wght@62.5..100,700..900&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3EFFC; --surface:#FFFFFF; --surface-2:#E9E2FA; --ink:#211936; --ink-soft:#5C5275;
  --line:#D8CFEE; --accent:#FF8A5B; --accent-ink:#2A1608; --lilac:#6A48D6;
  --low:#16876C; --med:#A86C08; --high:#C93A33; --redact:#CFC5E6;
  --shadow:0 1px 0 rgba(33,25,54,.06),0 6px 18px -10px rgba(33,25,54,.25);
  --display:"Noto Sans Display","Noto Sans",Roboto,"Segoe UI",system-ui,sans-serif;
  --body:"Noto Sans",Roboto,"Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1C1530; --surface:#271E40; --surface-2:#322750; --ink:#F2EDFF; --ink-soft:#B7ABD6;
    --line:#3E3260; --accent:#FF9F6E; --accent-ink:#2A1608; --lilac:#C3B1FF;
    --low:#46CFA9; --med:#F2B544; --high:#FF7A6B; --redact:#4A3D70;
    --shadow:0 1px 0 rgba(0,0,0,.2),0 10px 24px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#1C1530; --surface:#271E40; --surface-2:#322750; --ink:#F2EDFF; --ink-soft:#B7ABD6;
  --line:#3E3260; --accent:#FF9F6E; --accent-ink:#2A1608; --lilac:#C3B1FF;
  --low:#46CFA9; --med:#F2B544; --high:#FF7A6B; --redact:#4A3D70;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 10px 24px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding:72px 0 96px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lilac);outline-offset:2px;border-radius:12px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:8px;height:60px}
.brand{display:flex;align-items:center;gap:8px;margin-right:auto;font:800 20px/1 var(--display);letter-spacing:.01em;background:none;border:0;padding:6px 0;min-height:48px;cursor:pointer}
.brand svg{width:26px;height:26px;color:var(--accent)}
.brand span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-stretch:87.5%}
.brand{min-width:0}
.icon-btn.lang{font-weight:800;font-size:14px;letter-spacing:.02em}
.icon-btn{flex:none;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:none;display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:20px;height:20px}
.exit{flex:none;min-height:44px;padding:0 12px;border-radius:999px;border:0;background:var(--ink);color:var(--bg);font-weight:700;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:6px}
.exit svg{width:16px;height:16px}

/* views */
main.wrap{padding-bottom:120px}
.view{animation:enter .28s cubic-bezier(.2,.7,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.stagger>*{animation:rise .32s cubic-bezier(.2,.7,.2,1) both}
.stagger>*:nth-child(2){animation-delay:60ms}.stagger>*:nth-child(3){animation-delay:120ms}
.stagger>*:nth-child(4){animation-delay:180ms}.stagger>*:nth-child(5){animation-delay:240ms}
.stagger>*:nth-child(6){animation-delay:300ms}

h1,h2,h3{font-family:var(--display);font-stretch:75%;margin:0;line-height:1.02}
h1{font-size:44px;font-weight:900;letter-spacing:-.01em}
h2{font-size:32px;font-weight:900}
h3{font-size:20px;font-weight:800;font-stretch:87.5%;line-height:1.15}
.lede{color:var(--ink-soft);font-size:17px;margin:12px 0 0}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 8px}

/* hero: the witness's view of a chat, names redacted */
.hero{padding:24px 0 8px}
.hero h1 em{font-style:normal;color:var(--accent)}
.chatline{margin:20px 0 0;display:grid;gap:6px}
.peek{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink-soft)}
.bar{display:inline-block;height:12px;border-radius:4px;background:var(--redact);vertical-align:middle}
.peek .msg{background:var(--surface);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:8px 12px}
.peek.me{justify-content:flex-end}
.peek.me .msg{background:var(--accent);color:var(--accent-ink);border-color:transparent;border-radius:14px 4px 14px 14px;font-weight:600}

.section{margin-top:28px}
.cards{display:grid;gap:10px;margin-top:14px}
.card{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;min-height:76px;cursor:pointer;box-shadow:var(--shadow);transition:transform .18s ease}
.card:active{transform:scale(.98)}
.card .ic{flex:none;width:48px;height:48px;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;color:var(--lilac)}
.card .ic svg{width:26px;height:26px}
.card b{display:block;font-size:17px;line-height:1.25}
.card small{display:block;color:var(--ink-soft);font-size:14px;line-height:1.35;margin-top:2px}
.card .chev{margin-left:auto;flex:none;color:var(--ink-soft)}

.privacy{display:flex;gap:10px;align-items:flex-start;margin-top:18px;font-size:14px;color:var(--ink-soft)}
.privacy .bar{width:34px;flex:none;margin-top:4px}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tile{border-radius:18px;padding:14px;border:1.5px dashed var(--line);background:none;text-align:left;min-height:96px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.tile b{font-family:var(--display);font-stretch:87.5%;font-size:18px;line-height:1.1}
.tile span{font-size:13px;color:var(--ink-soft)}

/* back */
.back{display:inline-flex;align-items:center;gap:6px;min-height:48px;padding:0 4px;margin:8px 0 4px -4px;border:0;background:none;font-weight:600;color:var(--ink-soft);cursor:pointer}
.back svg{width:18px;height:18px}

/* actions */
.action{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.action+.action{margin-top:10px}
.action .head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.action p{margin:0}
.risk{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:12px;font-weight:700;color:var(--ink-soft);text-align:right;max-width:46%}
.meter{display:flex;gap:3px}
.meter i{width:14px;height:8px;border-radius:3px;background:var(--line)}
.risk.low .meter i:nth-child(1){background:var(--low)}
.risk.medium .meter i:nth-child(-n+2){background:var(--med)}
.risk.high .meter i{background:var(--high)}
.risk.low strong{color:var(--low)}.risk.medium strong{color:var(--med)}.risk.high strong{color:var(--high)}
.note{margin-top:10px;font-size:14px;color:var(--ink-soft);padding-left:10px;border-left:3px solid var(--line)}

.cta-row{display:grid;gap:10px;margin-top:18px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:8px 18px;border-radius:16px;border:0;font-weight:700;font-size:17px;cursor:pointer;text-align:center;transition:transform .15s ease}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;border:1.5px solid var(--ink);color:var(--ink)}
.btn svg{width:20px;height:20px;flex:none}

/* message bubbles: signature */
.thread{display:grid;gap:14px;margin-top:18px}
.bubble{justify-self:end;max-width:92%;background:var(--accent);color:var(--accent-ink);border-radius:20px 20px 6px 20px;padding:14px 16px 10px}
.bubble p{margin:0;font-size:17px;line-height:1.4;font-weight:500}
.bubble .copy{margin:10px 0 0 auto;display:flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:999px;border:0;background:rgba(42,22,8,.12);color:var(--accent-ink);font-weight:700;font-size:15px;cursor:pointer}
.bubble .copy svg{width:18px;height:18px}
.bubble .copy.done{background:var(--accent-ink);color:var(--accent)}
.sendnote{font-size:14px;color:var(--ink-soft);margin-top:14px;display:flex;gap:8px}
.sendnote svg{width:20px;height:20px;flex:none}

/* platforms */
.tabs{display:flex;gap:8px;margin-top:16px}
.tabs button{flex:1;min-height:48px;border-radius:14px;border:1.5px solid var(--line);background:none;font-weight:700;cursor:pointer;white-space:nowrap;padding:0 8px}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.steps{list-style:none;padding:0;margin:16px 0 0;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.steps li::before{content:counter(s);flex:none;width:32px;height:32px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-weight:800;font-family:var(--display)}
.anon{margin-top:14px;background:var(--surface);border-radius:16px;padding:12px 14px;border:1px solid var(--line);font-size:15px;display:flex;gap:10px}
.anon svg{flex:none;width:22px;height:22px;color:var(--low)}

/* care */
.care{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:10px}
.care li{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.care b{display:block;margin-bottom:2px}
.care span{color:var(--ink-soft);font-size:15px}

/* quiz */
.qcount{font-size:14px;font-weight:700;color:var(--ink-soft);margin-top:4px}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{width:100%;text-align:left;min-height:56px;padding:12px 16px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-size:16px}
.opt[disabled]{cursor:default}
.opt.good{border:2.5px solid var(--low)}
.opt.bad{border:2.5px solid var(--high)}
.opt.meh{border:2.5px solid var(--med)}
.fb{margin:6px 0 0;font-size:15px;color:var(--ink-soft);animation:rise .25s ease both}

/* help button + sheet */
.helpbar{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.helpbar .btn{max-width:528px;margin:0 auto;width:100%;background:var(--lilac);color:var(--bg)}
.scrim{position:fixed;inset:0;background:rgba(20,14,34,.55);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s ease}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--surface);border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;transform:translateY(105%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.7,.2,1),visibility 0s .28s;max-height:88vh;overflow:auto}
.open .scrim{opacity:1;pointer-events:auto}
.open .sheet{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.7,.2,1)}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.contact{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}
.contact .nums{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.tel{display:inline-flex;align-items:center;justify-content:center;min-height:48px;min-width:72px;padding:0 14px;border-radius:14px;background:var(--surface-2);color:var(--ink);text-decoration:none;font-family:var(--display);font-weight:800;font-size:20px;font-stretch:87.5%;white-space:nowrap}
.tel.alt{font-size:15px;min-height:44px}
.small{font-size:13px;color:var(--ink-soft)}

/* toast */
.toast{position:fixed;left:50%;bottom:92px;z-index:40;background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:700;opacity:0;transform:translate(-50%,12px);transition:opacity .2s ease,transform .2s ease;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* neutral exit page: plain, no motion */
#neutral{display:none;background:#fff;color:#222;min-height:100vh;font:16px/1.5 Roboto,Arial,sans-serif;padding:20px 16px}
#neutral h1{font:700 22px/1.2 Roboto,Arial,sans-serif;margin:0 0 14px}
#neutral table{width:100%;border-collapse:collapse}
#neutral td{border-bottom:1px solid #e3e3e3;padding:10px 4px;vertical-align:top}
body.exited{background:#fff}
body.exited #app{display:none}
body.exited #neutral{display:block}

/* mini-games */
.tile.wide{grid-column:1/-1;border-style:solid;border-color:transparent;background:var(--surface-2);flex-direction:row;align-items:center;min-height:72px}
.tile.wide b{font-size:20px}
.game-card{display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;min-height:96px;cursor:pointer;box-shadow:var(--shadow);transition:transform .18s ease}
.game-card:active{transform:scale(.98)}
.game-card b{font-family:var(--display);font-stretch:87.5%;font-size:22px;line-height:1.1}
.game-card span{color:var(--ink-soft);font-size:15px}
.calm{font-size:14px;color:var(--ink-soft);margin-top:14px}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;min-height:52px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:6px 14px 6px 8px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-size:15px;font-weight:600;animation:rise .25s ease both;transition:transform .15s ease}
.chip .em{width:34px;height:34px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:19px;line-height:1}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink);transform:translateY(-2px)}
.chip[aria-pressed="true"] .em{background:rgba(42,22,8,.12)}
.pool-done{color:var(--ink-soft);font-size:15px;align-self:center}
.zones{display:grid;gap:10px;margin-top:16px}
.zone{border-radius:22px;padding:6px 8px 10px;border:2px solid var(--line);background:var(--surface)}
.zone.z1{border-color:var(--low)}
.zone.z2{border-color:var(--lilac);border-style:dashed}
.zone.z3{border-style:dotted}
.zone-btn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:52px;padding:0 8px;border:0;background:none;cursor:pointer;font-weight:800;font-size:17px;font-family:var(--display);font-stretch:87.5%;text-align:left}
.zone-btn .ring{flex:none;width:30px;height:30px;border-radius:50%;border:3px solid currentColor;display:grid;place-items:center;font-size:20px;line-height:1;transition:transform .2s ease}
.zone.z1 .ring{color:var(--low)}.zone.z2 .ring{color:var(--lilac)}.zone.z3 .ring{color:var(--ink-soft)}
.armed .zone-btn .ring{transform:scale(1.15)}
.zone .placed{display:flex;flex-wrap:wrap;gap:6px;padding:0 4px}
.zone .placed:empty::after{content:attr(data-empty);font-size:14px;color:var(--ink-soft);padding:4px 4px 6px}
.result{list-style:none;padding:0;margin:16px 0 0;display:flex;flex-wrap:wrap;gap:8px}
.result li{display:inline-flex;align-items:center;gap:8px;padding:8px 14px 8px 8px;border-radius:999px;background:var(--surface);border:1.5px solid var(--low);font-weight:600;animation:rise .3s ease both}
.result li .em{font-size:20px}
.bridge{margin-top:18px;background:var(--surface-2);border-radius:18px;padding:16px;font-weight:600}
.bubbles{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:18px}
.worry{border:0;cursor:pointer;border-radius:50%;background:var(--surface-2);color:var(--ink);display:grid;place-items:center;text-align:center;padding:14px;font-weight:700;font-size:15px;line-height:1.25;box-shadow:inset 0 -6px 0 rgba(0,0,0,.06),var(--shadow);animation:rise .3s cubic-bezier(.2,.7,.2,1) both;transition:transform .15s ease}
.worry:active{transform:scale(.95)}
.worry.s0{width:150px;height:150px}.worry.s1{width:132px;height:132px}.worry.s2{width:142px;height:142px}
.worry.popping{animation:pop .26s ease-in forwards;pointer-events:none}
@keyframes pop{0%{transform:scale(1);opacity:1}60%{transform:scale(1.18);opacity:.6}100%{transform:scale(1.35);opacity:0}}
.answers{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:10px}
.answers li{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--low);border-radius:14px;padding:12px 14px;animation:rise .3s ease both}
.answers li small{display:block;color:var(--ink-soft);font-size:13px;text-decoration:line-through;margin-bottom:2px}
.answers li b{font-weight:600}
.tips{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:10px}
.tips li{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
@media (max-width:380px){ .brand{font-size:17px;gap:6px} .brand svg{width:22px;height:22px} .top .wrap{gap:6px} .exit{padding:0 10px} }
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="wrap">
      <button class="brand" id="brand" type="button"></button>
      <button class="icon-btn lang" id="langBtn" type="button"></button>
      <button class="icon-btn" id="theme" type="button"></button>
      <button class="exit" id="exit" type="button"></button>
    </div>
  </header>
  <main class="wrap" id="view" aria-live="polite"></main>
  <div class="helpbar"><button class="btn" id="helpBtn" type="button"></button></div>
  <div id="sheetHost">
    <div class="scrim" id="scrim"></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  </div>
  <div class="toast" id="toast" role="status"></div>
</div>
<div id="neutral"></div>

<script>
/* ================= CONTENT (all texts; logic below) ================= */
const content = {
  ui: {
    appName: {tj:"Шоҳид", ru:"Свидетель"},
    langShort: {tj:"ТҶ", ru:"РУ"},
    langSwitch: {tj:"Забони тоҷикӣ", ru:"Русский язык"},
    heroA: {tj:"Ту мебинӣ.", ru:"Ты видишь."},
    heroB: {tj:"Ту метавонӣ кӯмак кунӣ — бехатар.", ru:"Ты можешь помочь — безопасно."},
    lede: {tj:"Дар интернет таҳқирро мебинӣ ва намехоҳӣ хомӯш монӣ? Дар як дақиқа роҳи бехатарро меёбем — то на ба ту зарар расад, на ба ӯ.",
           ru:"Видишь травлю в сети и не хочешь молчать? За минуту найдём безопасный шаг — чтобы не пострадал ни ты, ни он."},
    peek1: {tj:"ҳа-ҳа, бинед инро 😂", ru:"ха-ха, гляньте 😂"},
    peek2: {tj:"Ман дидам. Ту танҳо нестӣ.", ru:"Я видел(а). Ты не один."},
    whatSee: {tj:"Ту чӣ мебинӣ?", ru:"Что ты видишь?"},
    whatSeeHint: {tj:"Интихоб кун — 3 роҳи кӯмакро нишон медиҳем.", ru:"Выбери — покажем 3 способа помочь."},
    privacy: {tj:"Ном лозим нест. Барнома ҳеҷ чизро нигоҳ намедорад ва ба ҳеҷ ҷо намефиристад.", ru:"Имена не нужны. Приложение ничего не сохраняет и никуда не отправляет."},
    more: {tj:"Боз", ru:"Ещё"},
    careTile: {tj:"Худатро эҳтиёт кун", ru:"Береги себя"},
    careTileSub: {tj:"Чӣ тавр кӯмак кунӣ ва худат зарар набинӣ", ru:"Как помогать и не попасть под удар"},

  team: {}, picked: null, teamDone: false, popped: []
};
const resetGames = () => { state.team = {}; state.picked = null; state.teamDone = false; state.popped = []; };
const $ = s => document.querySelector(s);
const view = $("#view");
const t = obj => obj[state.lang];
const U = k => t(content.ui[k]);
/* every dynamic string goes through esc(); templates below only combine static markup + escaped text */
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const put = (el, markup) => el.replaceChildren(document.createRange().createContextualFragment(markup));
const sitById = id => content.situations.find(s => s.id === id);

function backBtn(to){ return `<button class="back" data-go="${to}">${I.back}${esc(U(to==="home"?"home":"back"))}</button>`; }

const screens = {
  home(){
    return `
    <section class="hero">
      <h1>${esc(U("heroA"))}<br><em>${esc(U("heroB"))}</em></h1>
      <p class="lede">${esc(U("lede"))}</p>
      <div class="chatline" aria-hidden="true">
        <div class="peek"><span class="bar" style="width:44px"></span><span class="msg">${esc(U("peek1"))}</span></div>
        <div class="peek me"><span class="msg">${esc(U("peek2"))}</span></div>
      </div>
    </section>
    <section class="section">
      <h2>${esc(U("whatSee"))}</h2>
      <p class="lede" style="margin-top:6px">${esc(U("whatSeeHint"))}</p>
      <div class="cards stagger">
        ${content.situations.map(s => `
          <button class="card" data-sit="${s.id}">
            <span class="ic">${I[s.icon]}</span>
            <span><b>${esc(t(s.title))}</b><small>${esc(t(s.sub))}</small></span>
            <span class="chev">${I.chev}</span>
          </button>`).join("")}
      </div>
      <p class="privacy"><span class="bar" aria-hidden="true"></span>${esc(U("privacy"))}</p>
    </section>
    <section class="section">
      <p class="eyebrow">${esc(U("more"))}</p>
      <div class="tiles">
        <button class="tile" data-go="care"><b>${esc(U("careTile"))}</b><span>${esc(U("careTileSub"))}</span></button>
        <button class="tile" data-go="quiz"><b>${esc(U("quizTile"))}</b><span>${esc(U("quizTileSub"))}</span></button>
        <button class="tile wide" data-go="games"><span aria-hidden="true" style="font-size:28px">🫧</span><span style="flex:1"><b style="display:block">${esc(U("gamesTile"))}</b><span>${esc(U("gamesTileSub"))}</span></span><span class="chev">${I.chev}</span></button>
      </div>
    </section>`;
  },

  situation(){
    const s = sitById(state.sit);
    return `
    ${backBtn("home")}
    <p class="eyebrow">${esc(t(s.title))}</p>
    <h2>${esc(U("ways"))}</h2>
    <div class="stagger" style="margin-top:16px">
      ${s.actions.map(a => `
        <article class="action">
          <div class="head">
            <h3>${esc(t(content.ui.type[a.type]))}</h3>
            <div class="risk ${a.risk}">
              <span class="meter" aria-hidden="true"><i></i><i></i><i></i></span>
              <span>${esc(U("riskFor"))}: <strong>${esc(t(content.ui.risk[a.risk]))}</strong></span>
            </div>
          </div>
          <p>${esc(t(a.text))}</p>
          <p class="note">${esc(t(a.note))}</p>
        </article>`).join("")}
    </div>
    <div class="cta-row">
      <button class="btn primary" data-go="messages">${I.msg}${esc(U("toMessages"))}</button>
      <button class="btn ghost" data-go="report">${I.flag}${esc(U("toReport"))}</button>
    </div>`;
  },

  messages(){
    const s = sitById(state.sit);
    return `
    ${backBtn("situation")}
    <p class="eyebrow">${esc(t(s.title))}</p>
    <h2>${esc(U("msgsTitle"))}</h2>
    <p class="lede">${esc(U("msgsLede"))}</p>
    <div class="thread stagger">
      ${s.messages.map((m,i) => `
        <div class="bubble">
          <p>${esc(t(m))}</p>
          <button class="copy" data-copy="${i}">${I.copy}<span>${esc(U("copy"))}</span></button>
        </div>`).join("")}
    </div>
    <p class="sendnote">${I.lock}<span>${esc(U("sendNote"))}</span></p>
    <div class="cta-row">
      <button class="btn ghost" data-go="report">${I.flag}${esc(U("toReport"))}</button>
    </div>`;
  },

  report(){
    const p = content.platforms[state.platform];
    return `
    ${backBtn(state.sit ? "situation" : "home")}
    <h2>${esc(U("reportTitle"))}</h2>
    <p class="lede">${esc(U("reportLede"))}</p>
    <div class="tabs" role="tablist">
      ${content.platforms.map((pl,i) => `<button role="tab" aria-selected="${i===state.platform}" data-plat="${i}">${esc(pl.name)}</button>`).join("")}
    </div>
    <ol class="steps stagger" aria-label="${esc(p.name)}">
      ${p.steps.map(st => `<li><span>${esc(t(st))}</span></li>`).join("")}
    </ol>
    <div class="anon">${I.shield}<span><b>${esc(t(p.anon))}</b></span></div>
    <p class="note" style="margin-top:14px">${esc(U("proofTip"))}</p>
    <div class="cta-row"><button class="btn ghost" data-go="care">${esc(U("careTitle"))}</button></div>`;
  },

  care(){
    return `
    ${backBtn("home")}
    <h2>${esc(U("careTitle"))}</h2>
    <p class="lede">${esc(U("careLede"))}</p>
    <ul class="care stagger">
      ${content.care.map(c => `<li><b>${esc(t(c.t))}</b><span>${esc(t(c.d))}</span></li>`).join("")}
    </ul>`;
  },

  quiz(){
    const n = content.quiz.length;
    if (state.q >= n){
      return `${backBtn("home")}<h2>${esc(U("quizTitle"))}</h2><p class="lede">${esc(U("quizDone"))}</p>
      <div class="cta-row"><button class="btn primary" data-go="home">${esc(U("home"))}</button></div>`;
    }
    const q = content.quiz[state.q];
    return `
    ${backBtn("home")}
    <h2>${esc(U("quizTitle"))}</h2>
    <p class="qcount">${esc(U("question"))} ${state.q+1} ${esc(U("of"))} ${n}</p>
    <p class="lede" style="color:var(--ink);font-weight:600">${esc(t(q.q))}</p>
    <div class="opts">
      ${q.opts.map((o,i) => {
        const picked = state.answered === i;
        const cls = state.answered !== null && (picked || o.kind === "good") ? " " + o.kind : "";
        return `<div><button class="opt${cls}" data-opt="${i}" ${state.answered !== null ? "disabled" : ""}>${esc(t(o.a))}</button>
          ${picked ? `<p class="fb">${esc(t(o.f))}</p>` : ""}</div>`;
      }).join("")}
    </div>
    ${state.answered !== null ? `<div class="cta-row"><button class="btn primary" data-next>${esc(U(state.q+1 < n ? "next" : "finish"))}</button></div>` : ""}`;
  },

  games(){
    const g = content.ui;
    return `
    ${backBtn("home")}
    <h2>${esc(U("gamesTile"))}</h2>
    <p class="lede">${esc(U("gamesLede"))}</p>
    <div class="cards stagger">
      <button class="game-card" data-go="team"><b>🫂 ${esc(t(g.team.title))}</b><span>${esc(t(g.team.sub))}</span></button>
      <button class="game-card" data-go="pop"><b>🫧 ${esc(t(g.pop.title))}</b><span>${esc(t(g.pop.sub))}</span></button>
    </div>`;
  },

  team(){
    const T = content.ui.team;
    const chip = p => `<button class="chip" data-person="${p.id}" aria-pressed="${state.picked === p.id}"><span class="em" aria-hidden="true">${p.em}</span>${esc(t(p))}</button>`;
    if (state.teamDone){
      const trusted = T.people.filter(p => state.team[p.id] === "z1" || state.team[p.id] === "z2")
        .sort((a,b) => state.team[a.id].localeCompare(state.team[b.id]));
      return `
      ${backBtn("games")}
      <h2>${esc(t(T.title))}</h2>
      ${trusted.length ? `<p class="lede" style="color:var(--ink);font-weight:600">${esc(t(T.resultTitle))}</p>
        <ul class="result">${trusted.map(p => `<li><span class="em" aria-hidden="true">${p.em}</span>${esc(t(p))}</li>`).join("")}</ul>`
        : `<p class="lede">${esc(t(T.resultNone))}</p>`}
      <p class="bridge">${esc(U("bridge"))}</p>
      <div class="cta-row">
        <button class="btn primary" data-go="adultTips">${esc(U("howTell"))}</button>
        ${trusted.length ? "" : `<button class="btn ghost" data-help>${esc(U("help"))}</button>`}
        <button class="btn ghost" data-restart="team">${esc(U("restart"))}</button>
        <button class="btn ghost" data-go="pop">${esc(U("otherGame"))}: ${esc(t(content.ui.pop.title))}</button>
      </div>`;
    }
    const pool = T.people.filter(p => !state.team[p.id]);
    const placedCount = T.people.length - pool.length;
    return `
    ${backBtn("games")}
    <h2>${esc(t(T.title))}</h2>
    <p class="lede">${esc(t(T.lede))}</p>
    <div class="pool">${pool.length ? pool.map(chip).join("") : `<span class="pool-done">${esc(t(T.allPlaced))}</span>`}</div>
    <div class="zones ${state.picked ? "armed" : ""}">
      ${T.zones.map(z => `
        <div class="zone ${z.id}">
          <button class="zone-btn" data-zone="${z.id}"><span>${esc(t(z))}</span><span class="ring" aria-hidden="true">${state.picked ? "+" : ""}</span></button>
          <div class="placed" data-empty="${esc(state.picked ? t(T.put) : t(T.empty))}">${T.people.filter(p => state.team[p.id] === z.id).map(chip).join("")}</div>
        </div>`).join("")}
    </div>
    <div class="cta-row"><button class="btn primary" data-team-done ${placedCount ? "" : "disabled style=\"opacity:.5\""}>${esc(t(T.done))}</button></div>`;
  },

  pop(){
    const P = content.ui.pop, items = P.items;
    const left = items.map((it,i) => i).filter(i => !state.popped.includes(i));
    return `
    ${backBtn("games")}
    <h2>${esc(t(P.title))}</h2>
    <p class="lede">${esc(t(P.lede))}</p>
    ${left.length ? `<p class="qcount">${esc(t(P.left))}: ${left.length}</p>
      <div class="bubbles">${left.map(i => `<button class="worry s${i % 3}" data-worry="${i}">${esc(t(items[i].w))}</button>`).join("")}</div>`
      : `<p class="lede" style="color:var(--ink);font-weight:600">${esc(t(P.allDone))}</p>`}
    <ul class="answers">${state.popped.map(i => `<li><small>${esc(t(items[i].w))}</small><b>${esc(t(items[i].a))}</b></li>`).join("")}</ul>
    ${left.length ? "" : `
      <p class="bridge">${esc(U("bridge"))}</p>
      <div class="cta-row">
        <button class="btn primary" data-go="adultTips">${esc(U("howTell"))}</button>
        <button class="btn ghost" data-restart="pop">${esc(U("restart"))}</button>
        <button class="btn ghost" data-go="team">${esc(U("otherGame"))}: ${esc(t(content.ui.team.title))}</button>
      </div>`}`;
  },

  adultTips(){
    const A = content.ui.adultTips;
    return `
    ${backBtn("games")}
    <h2>${esc(t(content.ui.type.adult))}</h2>
    <p class="lede">${esc(t(A.lede))}</p>
    <ul class="tips stagger">${A.items.map(x => `<li>${esc(t(x))}</li>`).join("")}</ul>
    <div class="cta-row">
      <button class="btn primary" data-help>${esc(U("help"))}</button>
      <button class="btn ghost" data-go="games">${esc(U("toGames"))}</button>
    </div>`;
  }
};

function render(animate = true){
  document.documentElement.lang = state.lang === "tj" ? "tg" : "ru";
  document.title = U("appName");
  put($("#brand"), `${I.eye}<span>${esc(U("appName"))}</span>`);
  const other = state.lang === "tj" ? "ru" : "tj";
  $("#langBtn").textContent = content.ui.langShort[other];
  $("#langBtn").dataset.lang = other;
  $("#langBtn").setAttribute("aria-label", content.ui.langSwitch[other]);
  put($("#exit"), `${I.x}<span>${esc(U("quickExit"))}</span>`);
  $("#exit").setAttribute("aria-label", U("quickExitLabel"));
  $("#theme").setAttribute("aria-label", U("theme"));
  put($("#theme"), isDark() ? I.sun : I.moon);
  $("#helpBtn").textContent = U("help");
  put(view, `<div class="${animate ? "view" : ""}">${screens[state.screen]()}</div>`);
  if (sheetOpen) renderSheet();
}

function go(screen){
  if (screen === "quiz"){ state.q = 0; state.answered = null; }
  if (screen === "home") state.sit = null;
  if (screen === "team" && state.teamDone) { state.team = {}; state.teamDone = false; state.picked = null; }
  if (screen === "pop" && state.popped.length === content.ui.pop.items.length) state.popped = [];
  state.screen = screen;
  render();
  window.scrollTo(0, 0);
}

/* copy: Clipboard API on https, execCommand fallback for file:// and old Android WebView */
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly", "");
  ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;font-size:16px";
  document.body.appendChild(ta);
  ta.select(); ta.setSelectionRange(0, text.length);
  let ok = false; try{ ok = document.execCommand("copy"); }catch(e){}
  ta.remove(); return ok;
}
function copyText(text){
  if (navigator.clipboard && window.isSecureContext){
    return navigator.clipboard.writeText(text).then(() => true, () => fallbackCopy(text));
  }
  return Promise.resolve(fallbackCopy(text));
}
let toastTimer;
function toast(msg){
  const el = $("#toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
}

/* theme */
function isDark(){
  const th = document.documentElement.dataset.theme;
  return th ? th === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
}
const savedTheme = store.get("witness.theme");
if (savedTheme === "dark" || savedTheme === "light") document.documentElement.dataset.theme = savedTheme;

/* help sheet (O-9) */
let sheetOpen = false;
function renderSheet(){
  put($("#sheet"), `
    <div class="grab"></div>
    <h2>${esc(U("helpTitle"))}</h2>
    <p class="lede">${esc(U("helpLede"))}</p>
    <div style="margin-top:8px">
      <div class="contact"><span>${esc(U("helpAdult"))}</span></div>
      ${content.contacts.map(c => `<div class="contact"><span>${esc(t(c.label))}</span><span class="nums">${c.numbers.map((n,i) => `<a class="tel${i ? " alt" : ""}" href="tel:${esc(n.tel)}">${esc(n.show)}</a>`).join("")}</span></div>`).join("")}
    </div>
    <p class="small">${esc(U("helpNumbersNote"))}</p>
    <div class="cta-row"><button class="btn ghost" data-close>${esc(U("close"))}</button></div>`);
}
function openSheet(){ sheetOpen = true; renderSheet(); $("#sheetHost").classList.add("open"); $("#sheet").querySelector("[data-close]").focus(); }
function closeSheet(){ sheetOpen = false; $("#sheetHost").classList.remove("open"); $("#helpBtn").focus(); }

/* quick exit (F-6): instant, no animation, wipes app content, shows a neutral timetable */
function quickExit(){
  document.body.classList.add("exited");
  const L = state.lang;
  put($("#neutral"), `<h1>${esc(content.ui.neutralTitle[L])}</h1><table>${content.ui.neutralDays[L].map(d => `<tr><td><b>${esc(d[0])}</b></td><td>${esc(d[1])}</td></tr>`).join("")}</table>`);
  document.title = content.ui.neutralTitle[L];
  view.replaceChildren(); $("#sheet").replaceChildren();
  resetGames(); state.screen = "home"; state.sit = null; sheetOpen = false;
  document.querySelector('meta[name="theme-color"]').setAttribute("content", "#ffffff");
}

/* events */
document.addEventListener("click", e => {
  if (e.target.id === "scrim") return closeSheet();
  const el = e.target.closest("button");
  if (!el) return;
  if (el.id === "exit") return quickExit();
  if (el.id === "brand") return go("home");
  if (el.id === "helpBtn") return openSheet();
  if (el.id === "theme"){
    const next = isDark() ? "light" : "dark";
    document.documentElement.dataset.theme = next; store.set("witness.theme", next);
    return render(false);
  }
  if (el.hasAttribute("data-close")) return closeSheet();
  const d = el.dataset;
  if (d.lang){ state.lang = d.lang; store.set("witness.lang", d.lang); return render(false); }
  if (d.sit){ state.sit = d.sit; state.platform = 0; return go("situation"); }
  if (d.go) return go(d.go);
  if (d.plat !== undefined){ state.platform = +d.plat; return render(false); }
  if (d.copy !== undefined){
    const text = t(sitById(state.sit).messages[+d.copy]);
    copyText(text).then(ok => {
      if (!ok) return toast(U("copyFail"));
      toast(U("copied"));
      document.querySelectorAll(".copy.done").forEach(b => { b.classList.remove("done"); put(b, `${I.copy}<span>${esc(U("copy"))}</span>`); });
      el.classList.add("done"); put(el, `${I.check}<span>${esc(U("copied"))}</span>`);
    });
    return;
  }
  if (d.opt !== undefined){ state.answered = +d.opt; return render(false); }
  if (d.person){ state.picked = state.picked === d.person ? null : d.person; return render(false); }
  if (d.zone){ if (state.picked){ state.team[state.picked] = d.zone; state.picked = null; } return render(false); }
  if (el.hasAttribute("data-team-done")){ if (Object.keys(state.team).length){ state.teamDone = true; state.picked = null; render(); window.scrollTo(0,0); } return; }
  if (d.restart === "team"){ state.team = {}; state.picked = null; state.teamDone = false; return render(); }
  if (d.restart === "pop"){ state.popped = []; return render(); }
  if (el.hasAttribute("data-help")) return openSheet();
  if (d.worry !== undefined){
    const i = +d.worry;
    if (state.popped.includes(i)) return;
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const finish = () => { if (!state.popped.includes(i) && state.screen === "pop"){ state.popped.push(i); render(false); } };
    if (reduce) return finish();
    el.classList.add("popping"); setTimeout(finish, 260);
    return;
  }
  if (el.hasAttribute("data-next")){ state.q++; state.answered = null; return render(); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && sheetOpen) closeSheet(); });

render();
</script>
