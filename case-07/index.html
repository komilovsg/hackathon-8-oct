<!doctype html>
<html lang="tg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17232E">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'%3E%3Crect x='2' y='5' width='22' height='15' rx='7' fill='%23EBA43D'/%3E%3Crect x='12' y='16' width='22' height='15' rx='7' fill='%2320233A'/%3E%3C/svg%3E">
<title>Аз тарафи дигар · С другой стороны</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;800&family=Noto+Serif:ital,wght@1,400;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E4ECEE;          /* туманное утро */
  --paper:#FFFFFF;
  --ink:#17232E;
  --muted:#556370;
  --line:#C9D5D9;
  --saffron:#EBA43D;     /* «ваш» голос */
  --saffron-soft:#FBE7C6;
  --night:#20233A;       /* другая сторона */
  --night-2:#2C3050;
  --night-ink:#F2ECE2;
  --night-muted:#B4B2C8;
  --support:#2E8B6A;
  --blame:#C4553F;
  --minimize:#8A68B0;
  --silence:#6F7B8A;
  --punish:#B4472F;
  --expose:#A8701F;
  --help:#B23A3A;
  --r:1.1rem;
  --sans:"Noto Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --serif:"Noto Serif",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html{font-size:16px;-webkit-text-size-adjust:100%}
html.cls{font-size:26px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.5 var(--sans);min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.wrap{max-width:34rem;margin:0 auto;padding:0 16px}
html.cls .wrap{max-width:46rem}

/* header */
header{position:sticky;top:0;z-index:60;background:var(--bg);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:8px;min-height:64px}
.logo{display:flex;align-items:center;gap:.5rem;min-height:48px;padding:0 .25rem 0 0;font-weight:800;font-size:.95rem;line-height:1.1;text-align:left;flex:1;min-width:0}
.logo svg{flex:none;width:36px;height:36px}
.logo span{overflow:hidden;text-overflow:ellipsis}
.helpbtn{min-height:48px;padding:.35rem .8rem;border-radius:999px;background:var(--help);color:#fff;font-weight:600;font-size:.85rem;line-height:1.15;max-width:11rem;text-align:center}
.langbtn{min-height:48px;min-width:48px;border-radius:999px;border:2px solid var(--ink);font-weight:800;font-size:.85rem;letter-spacing:.04em}
@media (max-width:400px){.logo span{display:none}}

/* screens */
main{padding:1.25rem 0 3rem}
.screen{animation:in .3s ease-out both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* home */
.hero{padding:.5rem 0 1.25rem}
.hero h1{font:800 2.4rem/1.05 var(--sans);letter-spacing:-.02em;margin:.25rem 0 .9rem}
.hero h1 em{font:italic 600 1em/1 var(--serif);letter-spacing:0;color:var(--night)}
.hero p{margin:0;font-size:1.06rem;color:var(--ink);max-width:30rem}
.duo{display:flex;flex-direction:column;gap:.4rem;margin:0 0 1.2rem}
.duo .b{max-width:82%;padding:.6rem .9rem;border-radius:var(--r);font-size:.95rem}
.duo .b1{align-self:flex-end;background:var(--saffron);border-bottom-right-radius:.3rem}
.duo .b2{align-self:flex-start;background:var(--night);color:var(--night-ink);font-family:var(--serif);font-style:italic;border-bottom-left-radius:.3rem}
h2{font-size:1.15rem;margin:1.5rem 0 .75rem;font-weight:800}
.roles{display:grid;gap:.6rem}
.role{display:flex;align-items:center;gap:.9rem;text-align:left;background:var(--paper);border-radius:var(--r);padding:1rem;min-height:72px;transition:transform .2s ease}
.role:active{transform:scale(.98)}
.role .ico{flex:none;width:2.6rem;height:2.6rem;border-radius:50%;display:grid;place-items:center;background:var(--saffron-soft);font-size:1.3rem}
.role b{display:block;font-size:1.08rem}
.role small{display:block;color:var(--muted);font-size:.9rem;line-height:1.35}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:1rem;width:100%;background:var(--paper);border-radius:var(--r);padding:.9rem 1rem;min-height:64px;text-align:left;margin-top:.6rem}
.toggle small{display:block;color:var(--muted);font-size:.85rem;line-height:1.35}
.sw{flex:none;width:52px;height:30px;border-radius:999px;background:var(--line);position:relative}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s ease}
.sw.on{background:var(--support)}
.sw.on::after{transform:translateX(22px)}
.note{font-size:.85rem;color:var(--muted);margin-top:1.25rem}

/* story */
.meta{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.75rem}
.back{min-height:48px;min-width:48px;border-radius:999px;background:var(--paper);font-size:1.2rem}
.meta .lbl{flex:1;font-size:.85rem;color:var(--muted);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:.4rem;min-height:48px;padding:0 .9rem;border-radius:999px;background:var(--paper);font-size:.85rem;font-weight:600}
.chip.on{background:var(--ink);color:#fff}
.setup{font-size:.95rem;color:var(--muted);margin:0 0 1rem;padding-left:.75rem;border-left:3px solid var(--saffron)}
.phone{background:var(--paper);border-radius:1.4rem;padding:1rem .8rem;min-height:14rem}
.who{display:flex;align-items:center;gap:.6rem;padding:0 .2rem .8rem;border-bottom:1px solid var(--bg);margin-bottom:.8rem}
.ava{flex:none;width:2.4rem;height:2.4rem;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:var(--night)}
.who b{display:block;line-height:1.2}
.who small{color:var(--muted);font-size:.8rem}
.msgs{display:flex;flex-direction:column;gap:.45rem}
.msg{align-self:flex-start;max-width:88%;background:var(--bg);padding:.6rem .85rem;border-radius:var(--r);border-bottom-left-radius:.3rem;animation:pop .25s ease-out both}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
.typing{align-self:flex-start;display:flex;align-items:center;gap:.5rem;color:var(--muted);font-size:.85rem;padding:.3rem .2rem;animation:pop .2s ease-out both}
.dots{display:inline-flex;gap:4px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:dot 1.2s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-4px);opacity:1}}
.next{display:block;width:100%;min-height:56px;margin-top:1rem;border-radius:var(--r);background:var(--ink);color:#fff;font-weight:700;font-size:1.05rem}
.next.warm{background:var(--saffron);color:var(--ink)}
.tapzone{cursor:pointer}
.choices{margin-top:1.25rem;animation:in .3s ease-out both}
.choices h2{margin-top:0}
.choice{display:block;width:100%;text-align:left;background:var(--paper);border:2px solid var(--saffron);border-radius:var(--r);border-bottom-right-radius:.3rem;padding:.8rem 1rem;margin-bottom:.6rem;min-height:56px;font-size:1rem;transition:transform .15s ease}
.choice:active{transform:scale(.98)}
.choice.tried{border-style:dashed;opacity:.85}
.choice .t{display:block;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-top:.35rem}

/* feels: другая сторона */
.other{background:var(--night);color:var(--night-ink);border-radius:1.4rem;padding:1.25rem 1rem 1.4rem;animation:flip .38s cubic-bezier(.2,.7,.2,1) both;transform-origin:50% 0}
.other.still{animation:none}
@keyframes flip{from{opacity:0;transform:perspective(900px) rotateX(-14deg) translateY(12px)}to{opacity:1;transform:none}}
.other .kick{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--night-muted);font-weight:600}
.other h1{font-size:1.4rem;line-height:1.2;margin:.3rem 0 1rem}
.said{background:var(--saffron);color:var(--ink);border-radius:var(--r);border-bottom-right-radius:.3rem;padding:.7rem .9rem;margin:0 0 1.1rem 12%;font-size:.95rem}
.said .t{display:block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.2rem;opacity:.8}
.inner{margin:0;padding:0;list-style:none}
.inner li{font:italic 400 1.18rem/1.5 var(--serif);margin:0 0 .8rem;padding-left:1rem;border-left:2px solid var(--night-muted);animation:pop .3s ease-out both}
.inner li.still{animation:none}
.sum{display:flex;gap:.6rem;align-items:flex-start;background:var(--night-2);border-radius:var(--r);padding:.8rem .9rem;margin-top:1rem;animation:pop .3s ease-out both}
.sum .dot{flex:none;width:.8rem;height:.8rem;border-radius:50%;margin-top:.35rem}
.cmp{margin-top:1.25rem}
.cmp h2,.tally h2{color:var(--night-ink);font-size:1rem;margin:0 0 .6rem}
.cmp .row{display:grid;grid-template-columns:auto 1fr;gap:.6rem;align-items:start;padding:.6rem 0;border-top:1px solid var(--night-2);font-size:.95rem}
.tag{display:inline-block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:.2rem .5rem;border-radius:.4rem;color:#fff;white-space:nowrap}
.tally{margin-top:1.25rem}
.bar{display:grid;grid-template-columns:7.5rem 1fr 2rem;gap:.5rem;align-items:center;font-size:.85rem;margin-bottom:.4rem}
.bar .track{height:.7rem;border-radius:999px;background:var(--night-2);overflow:hidden}
.bar .fill{display:block;height:100%;border-radius:999px;transform-origin:left}
.actions{display:grid;gap:.6rem;margin-top:1.25rem}
.btn{min-height:56px;border-radius:var(--r);font-weight:700;font-size:1rem;padding:.6rem 1rem}
.btn.pri{background:var(--saffron);color:var(--ink)}
.btn.sec{background:var(--paper);color:var(--ink)}
.btn.ghost{background:transparent;border:2px solid var(--night-muted);color:var(--night-ink)}

/* better */
.better h1{font-size:1.5rem;line-height:1.2;margin:.2rem 0 .5rem}
.better .lead{color:var(--muted);margin:0 0 1rem}
.phrase{background:var(--paper);border-radius:var(--r);padding:1rem;margin-bottom:.7rem;border-left:5px solid var(--support);animation:pop .3s ease-out both}
.phrase:nth-child(2){animation-delay:.08s}.phrase:nth-child(3){animation-delay:.16s}
.phrase p{margin:0 0 .6rem;font-size:1.08rem;font-weight:600}
.copy{min-height:48px;padding:0 1rem;border-radius:999px;background:var(--bg);font-weight:600;font-size:.9rem}
.copy.ok{background:var(--support);color:#fff}
.truth{background:var(--night);color:var(--night-ink);border-radius:var(--r);padding:1rem;margin:1.25rem 0 0;font:italic 400 1.05rem/1.5 var(--serif)}

/* help */
.modal{position:fixed;inset:0;z-index:50;background:rgba(23,35,46,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease-out both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--paper);width:100%;max-width:34rem;border-radius:1.4rem 1.4rem 0 0;padding:1.25rem 16px 1.5rem;max-height:calc(100vh - 80px);overflow:auto;animation:up .3s ease-out both}
html.cls .sheet{max-width:46rem}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{margin-top:0;font-size:1.3rem}
.sheet ul{padding-left:1.2rem;margin:.5rem 0 1rem}
.sheet li{margin-bottom:.35rem}
.contact{display:flex;justify-content:space-between;gap:1rem;background:var(--bg);border-radius:.8rem;padding:.8rem 1rem;margin-bottom:.5rem;font-weight:600}
.contact{align-items:center}
.contact .nums{display:flex;flex-direction:column;align-items:flex-end;gap:.3rem;flex:none}
.contact a{display:inline-flex;align-items:center;min-height:48px;padding:0 .9rem;border-radius:999px;background:var(--support);color:#fff;font-weight:800;text-decoration:none;white-space:nowrap}
.sheet .note{margin:.5rem 0 1rem}
.close{width:100%}

/* mini-games */
.gamecard{display:flex;align-items:center;gap:.9rem;width:100%;text-align:left;background:var(--night);color:var(--night-ink);border-radius:var(--r);padding:1rem;min-height:72px;margin-top:.6rem;transition:transform .2s ease}
.gamecard:active,.gpick:active,.wbtn:active{transform:scale(.98)}
.gamecard .ico{flex:none;width:2.6rem;height:2.6rem;border-radius:50%;display:grid;place-items:center;background:var(--night-2);font-size:1.3rem}
.gamecard b{display:block;font-size:1.08rem}
.gamecard small{display:block;color:var(--night-muted);font-size:.9rem;line-height:1.35}
.gtitle{font-size:1.5rem;line-height:1.2;margin:.2rem 0 .5rem}
.glead{color:var(--muted);margin:0 0 1rem}
.gpick{display:flex;gap:.9rem;align-items:center;width:100%;text-align:left;background:var(--paper);border-radius:var(--r);padding:1rem;min-height:80px;margin-bottom:.6rem;transition:transform .2s ease}
.gpick .em{flex:none;font-size:2rem;width:3rem;text-align:center}
.gpick b{display:block;font-size:1.08rem}
.gpick small{display:block;color:var(--muted);font-size:.9rem;line-height:1.35}
.gcount{font-size:.85rem;font-weight:700;color:var(--muted);margin:0 0 .6rem}
.pond{display:flex;flex-wrap:wrap;justify-content:center;gap:.7rem;padding:1rem .5rem;background:var(--night);border-radius:1.4rem;min-height:6rem}
.bub{width:7.4rem;height:7.4rem;border-radius:50%;padding:.6rem;display:flex;align-items:center;justify-content:center;text-align:center;font:italic 400 .95rem/1.25 var(--serif);color:var(--night-ink);background:var(--night-2);box-shadow:inset 0 0 0 2px rgba(242,236,226,.18),inset -.6rem -.8rem 1.4rem rgba(0,0,0,.25);animation:rise .35s ease-out backwards;transition:transform .22s ease,opacity .22s ease}
.bub:nth-child(even){transform:translateY(.6rem)}
.bub.gone{transform:scale(1.35);opacity:0;pointer-events:none}
@keyframes rise{from{opacity:0;transform:translateY(1.2rem) scale(.9)}to{opacity:1}}
.pondDone{color:var(--night-muted);font:italic 400 1rem/1.4 var(--serif);text-align:center;padding:1rem}
.said2{list-style:none;margin:1rem 0 0;padding:0}
.said2 li{background:var(--paper);border-radius:var(--r);border-left:5px solid var(--support);padding:.75rem 1rem;margin-bottom:.55rem;animation:pop .3s ease-out both}
.said2 s{display:block;color:var(--muted);font-size:.85rem;text-decoration-thickness:2px}
.said2 b{display:block;font-size:1.05rem}
.bridge{background:var(--saffron-soft);border-radius:var(--r);padding:1rem;margin-top:1rem;animation:pop .3s ease-out both}
.bridge b{display:block;font-size:1.08rem;margin-bottom:.3rem}
.bridge p{margin:0}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.wbtn{min-height:6.5rem;border-radius:var(--r);background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.25rem;font-weight:700;border:3px solid transparent;transition:transform .2s ease}
.wbtn .em{font-size:2.2rem;line-height:1}
.wbtn[aria-pressed=true]{border-color:var(--saffron);background:var(--saffron-soft)}
.wans{margin-top:1rem;animation:in .3s ease-out both}
.wans .box{background:var(--paper);border-radius:var(--r);padding:1rem;margin-bottom:.6rem}
.wans .box.dark{background:var(--night);color:var(--night-ink)}
.wans .k{display:block;font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:.3rem}
.wans .dark .k{color:var(--night-muted)}
.wans p{margin:0}

/* reduced motion */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
html.static *{animation:none!important}
</style>
</head>

<main class="wrap" id="app" aria-live="polite"></main>

/* ================= LOGIC ================= */
const $ = s => document.querySelector(s);
const app = $("#app");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let lang = "tj";
try { const l = localStorage.getItem("c07-lang"); if (l === "ru" || l === "tj") lang = l; } catch (e) {}

const S = { pop: [], weather: null, screen: "home", si: 0, shown: 0, ri: null, inner: 0, cls: false, tried: {}, tally: {} };
let timers = [];
const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };
const later = (fn, ms) => timers.push(setTimeout(fn, reduce ? 0 : ms));

const L = o => (o && typeof o === "object" && lang in o) ? o[lang] : o;
const U = (k, vars) => { let s = L(content.ui[k]); if (vars) for (const v in vars) s = s.replace("{" + v + "}", vars[v]); return s; };
/* all dynamic text passes through esc(); markup comes only from this file */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const put = (el, markup) => { el.textContent = ""; el.appendChild(document.createRange().createContextualFragment(markup)); };
const story = () => content.stories[S.si];
const T = t => content.types[t];

function chrome() {
  document.documentElement.lang = lang === "tj" ? "tg" : "ru";
  document.documentElement.classList.toggle("cls", S.cls);
  $("#brand").textContent = U("brand");
  $("#logo").setAttribute("aria-label", U("brand"));
  $("#helpBtn").textContent = U("help");
  $("#langBtn").textContent = U("langSwitch");
  $("#langBtn").setAttribute("aria-label", U("langAria"));
}

function go(screen, patch) {
  clearTimers();
  $("#modalRoot").textContent = "";
  Object.assign(S, patch || {}, { screen });
  render(false);
  window.scrollTo(0, 0);
}

function render(isStatic) {
  chrome();
  const html = document.documentElement;
  if (isStatic) html.classList.add("static");
  ({ home: renderHome, story: renderStory, feels: renderFeels, better: renderBetter, games: renderGames, pop: renderPop, weather: renderWeather })[S.screen]();
  if (isStatic) requestAnimationFrame(() => requestAnimationFrame(() => html.classList.remove("static")));
}

function classToggle() {
  return `<button class="chip ${S.cls ? "on" : ""}" data-act="cls" aria-pressed="${S.cls}">▣ ${esc(U("classTitle"))}</button>`;
}
function metaBar(backAct, extra) {
  return `<div class="meta"><button class="back" data-act="${backAct}" aria-label="${esc(U("back"))}">←</button>
    <span class="lbl">${esc(U("storyOf", { n: S.si + 1 }))}${extra ? " · " + esc(extra) : ""}</span>${classToggle()}</div>`;
}

/* ---- home ---- */
function renderHome() {
  put(app, `<section class="screen">
    <div class="hero">
      <div class="duo" aria-hidden="true"><div class="b b1">${esc(U("duo1"))}</div><div class="b b2">${esc(U("duo2"))}</div></div>
      <h1>${esc(U("heroA"))}<em>${esc(U("heroB"))}</em></h1>
      <p>${esc(U("heroP"))}</p>
    </div>
    <h2>${esc(U("roleQ"))}</h2>
    <div class="roles">${content.roles.map(r => `
      <button class="role" data-role="${r.id}"><span class="ico" aria-hidden="true">${r.icon}</span>
      <span><b>${esc(L(r.label))}</b><small>${esc(L(r.desc))}</small></span></button>`).join("")}
    </div>
    <button class="toggle" data-act="cls" aria-pressed="${S.cls}"><span><b>${esc(U("classTitle"))}</b><small>${esc(U("classDesc"))}</small></span><span class="sw ${S.cls ? "on" : ""}" aria-hidden="true"></span></button>
    <button class="gamecard" data-act="games"><span class="ico" aria-hidden="true">🫧</span><span><b>${esc(L(content.games.card))}</b><small>${esc(L(content.games.cardDesc))}</small></span></button>
    <p class="note">${esc(U("fiction"))}</p>
  </section>`);
}

/* ---- story / chat ---- */
function renderStory() {
  const st = story(), msgs = st.messages;
  put(app, `<section class="screen">
    ${metaBar("home")}
    <p class="setup">${esc(L(st.setup))}</p>
    <div class="phone ${S.cls && S.shown < msgs.length ? "tapzone" : ""}" id="phone">
      <div class="who"><span class="ava" aria-hidden="true">${esc(L(st.name).charAt(0))}</span><span><b>${esc(L(st.name))}</b><small>${esc(L(st.age))}</small></span></div>
      <div class="msgs" id="msgs">${msgs.slice(0, S.shown).map(m => `<div class="msg">${esc(L(m))}</div>`).join("")}</div>
    </div>
    <div id="after"></div>
  </section>`);
  if (S.shown >= msgs.length) showChoices(false);
  else if (S.cls) put($("#after"), `<button class="next" data-act="adv">${esc(U("next"))}</button>`);
  else autoPlay();
}

function appendMsg() {
  const el = document.createElement("div");
  el.className = "msg"; el.textContent = L(story().messages[S.shown]);
  $("#msgs").appendChild(el);
  S.shown++;
  el.scrollIntoView({ block: "nearest", behavior: reduce ? "auto" : "smooth" });
}

function autoPlay() {
  const msgs = story().messages;
  if (S.screen !== "story" || S.cls) return;
  if (S.shown >= msgs.length) { showChoices(true); return; }
  const ty = document.createElement("div");
  ty.className = "typing";
  put(ty, `<span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span>${esc(L(story().name))} ${esc(U("typing"))}</span>`);
  $("#msgs").appendChild(ty);
  const len = L(msgs[S.shown]).length;
  later(() => { ty.remove(); appendMsg(); later(autoPlay, 450); }, Math.min(650 + len * 9, 1500));
}

function advance() {
  if (S.screen === "story" && S.shown < story().messages.length) {
    appendMsg();
    if (S.shown >= story().messages.length) { $("#phone").classList.remove("tapzone"); showChoices(true); }
  } else if (S.screen === "feels") {
    if (S.inner < L(story().reactions[S.ri].feels).length) { S.inner++; renderFeels(true); }
  }
}

function showChoices(scroll) {
  const st = story(), tried = S.tried[st.id] || [];
  put($("#after"), `<div class="choices" id="choices"><h2>${esc(U("answerQ"))}</h2>
    <p class="setup">${esc(U("answerHint"))}</p>
    ${st.reactions.map((r, i) => {
      const was = tried.includes(i);
      return `<button class="choice ${was ? "tried" : ""}" data-ri="${i}">«${esc(L(r.label))}»${was ? `<span class="t" style="color:${T(r.type).color}">${esc(L(T(r.type).label))} · ${esc(U("tried"))}</span>` : ""}</button>`;
    }).join("")}</div>`);
  if (scroll) $("#choices").scrollIntoView({ block: "start", behavior: reduce ? "auto" : "smooth" });
}

function choose(i) {
  const st = story();
  const list = S.tried[st.id] = S.tried[st.id] || [];
  if (!list.includes(i)) list.push(i);
  const t = S.tally[st.id] = S.tally[st.id] || {};
  const type = st.reactions[i].type;
  t[type] = (t[type] || 0) + 1;
  go("feels", { ri: i, inner: S.cls ? 1 : 0 });
}

/* ---- feels: the other side ---- */
function renderFeels(partial) {
  const st = story(), r = st.reactions[S.ri], lines = L(r.feels);
  const tried = S.tried[st.id] || [];
  const done = S.inner >= lines.length;
  const typ = T(r.type);
  let cmp = "";
  if (done && tried.length > 1) {
    cmp = `<div class="cmp"><h2>${esc(U("compareTitle"))}</h2>${tried.map(i => {
      const rr = st.reactions[i], tt = T(rr.type);
      return `<div class="row"><span class="tag" style="background:${tt.color}">${esc(L(tt.label))}</span><span>${esc(L(rr.summary))}</span></div>`;
    }).join("")}</div>`;
  }
  let tally = "";
  if (done && S.cls) {
    const tl = S.tally[st.id] || {}, total = Object.values(tl).reduce((a, b) => a + b, 0) || 1;
    tally = `<div class="tally"><h2>${esc(U("tallyTitle"))}</h2>${st.reactions.map(x => {
      const n = tl[x.type] || 0, tt = T(x.type);
      return `<div class="bar"><span>${esc(L(tt.label))}</span><span class="track"><span class="fill" style="background:${tt.color};transform:scaleX(${n / total})"></span></span><b>${n}</b></div>`;
    }).join("")}</div>`;
  }
  const actions = done
    ? `<div class="actions">
        <button class="btn ${r.type === "support" ? "ghost" : "pri"}" data-act="retry">${esc(U("tryOther"))}</button>
        <button class="btn ${r.type === "support" ? "pri" : "ghost"}" data-act="better">${esc(U("instead"))}</button>
      </div>`
    : (S.cls ? `<button class="next warm" data-act="adv">${esc(U("next"))}</button>` : "");
  put(app, `<section class="${partial ? "" : "screen"}">
    ${metaBar("story")}
    <div class="other ${partial ? "still" : ""}">
      <div class="kick">${esc(U("otherSide"))}</div>
      <h1>${esc(U("feelsTitle", { name: L(st.name) }))}</h1>
      <div class="said"><span class="t">${esc(U("youSaid"))} · ${esc(L(typ.label))}</span>«${esc(L(r.label))}»</div>
      <ul class="inner">${lines.slice(0, S.inner).map((l, i) => `<li class="${partial && i < S.inner - 1 ? "still" : ""}">${esc(l)}</li>`).join("")}</ul>
      ${done ? `<div class="sum"><span class="dot" style="background:${typ.color}"></span><span>${esc(L(r.summary))}</span></div>` : ""}
      ${cmp}${tally}${actions}
    </div>
  </section>`);
  if (!done && !S.cls) later(() => { S.inner++; renderFeels(true); }, S.inner === 0 ? 420 : 950);
  if (partial) {
    const last = app.querySelector(done ? ".actions" : ".inner li:last-child, .next");
    if (last) last.scrollIntoView({ block: "nearest", behavior: reduce ? "auto" : "smooth" });
  }
}

/* ---- better ---- */
/* ---- mini-games (nothing is saved; state lives only in memory) ---- */
const G = content.games;
function gameBar(backAct, title) {
  return `<div class="meta"><button class="back" data-act="${backAct}" aria-label="${esc(U("back"))}">←</button>
    <span class="lbl">${esc(title)}</span>${classToggle()}</div>`;
}
function renderGames() {
  put(app, `<section class="screen">
    ${gameBar("home", L(G.card))}
    <h1 class="gtitle">${esc(L(G.card))}</h1>
    <p class="glead">${esc(L(G.lead))}</p>
    ${["pop", "weather"].map(k => `<button class="gpick" data-act="${k}"><span class="em" aria-hidden="true">${G[k].icon}</span><span><b>${esc(L(G[k].title))}</b><small>${esc(L(G[k].desc))}</small></span></button>`).join("")}
  </section>`);
}

function popListItem(i) {
  const b = G.pop.bubbles[i];
  return `<li><s>${esc(L(b.worry))}</s><b>«${esc(L(b.support))}»</b></li>`;
}
function popBridge() {
  return `<div class="bridge" id="popBridge"><b>${esc(L(G.pop.bridgeT))}</b><p>${esc(L(G.pop.bridge))}</p></div>
    <div class="actions"><button class="btn pri" data-act="popAgain">${esc(L(G.again))}</button>
    <button class="btn sec" data-act="games">${esc(L(G.toGames))}</button></div>`;
}
function renderPop() {
  const all = G.pop.bubbles, done = S.pop.length >= all.length;
  put(app, `<section class="screen">
    ${gameBar("games", L(G.card))}
    <h1 class="gtitle">${esc(L(G.pop.title))}</h1>
    <p class="glead">${esc(L(G.pop.hint))}</p>
    <p class="gcount" id="popCount">${esc(L(G.pop.count).replace("{n}", S.pop.length).replace("{t}", all.length))}</p>
    <div class="pond" id="pond">${done ? `<p class="pondDone">${esc(L(G.pop.empty))}</p>` :
      all.map((b, i) => S.pop.includes(i) ? "" : `<button class="bub" data-pop="${i}" style="animation-delay:${(i % 6) * 60}ms">${esc(L(b.worry))}</button>`).join("")}</div>
    <ul class="said2" id="said2" aria-live="polite">${S.pop.map(popListItem).join("")}</ul>
    <div id="popEnd">${done ? popBridge() : ""}</div>
  </section>`);
}
function popBubble(btn) {
  const i = +btn.dataset.pop;
  if (S.pop.includes(i)) return;
  S.pop.push(i);
  btn.classList.add("gone");
  $("#said2").insertAdjacentHTML("beforeend", popListItem(i));
  $("#popCount").textContent = L(G.pop.count).replace("{n}", S.pop.length).replace("{t}", G.pop.bubbles.length);
  later(() => {
    btn.remove();
    if (S.pop.length >= G.pop.bubbles.length) {
      put($("#pond"), `<p class="pondDone">${esc(L(G.pop.empty))}</p>`);
      put($("#popEnd"), popBridge());
      $("#popBridge").scrollIntoView({ block: "nearest", behavior: reduce ? "auto" : "smooth" });
    }
  }, 230);
}

function renderWeather() {
  const W = G.weather, sel = W.options.find(o => o.id === S.weather);
  put(app, `<section class="screen">
    ${gameBar("games", L(G.card))}
    <h1 class="gtitle">${esc(L(W.title))}</h1>
    <p class="glead">${esc(L(W.q))}</p>
    <div class="wgrid">${W.options.map(o => `<button class="wbtn" data-weather="${o.id}" aria-pressed="${o.id === S.weather}"><span class="em" aria-hidden="true">${o.em}</span><span>${esc(L(o.label))}</span></button>`).join("")}</div>
    <p class="note">${esc(L(W.note))}</p>
    <div id="wans">${sel ? `<div class="wans" id="wansIn">
      <div class="box"><span class="k">${esc(L(W.youLbl))}</span><p>${esc(L(sel.you))}</p>
        ${sel.help ? `<div class="actions"><button class="btn pri" data-act="openHelp">${esc(L(W.openHelp))}</button></div>` : ""}</div>
      <div class="box dark"><span class="k">${esc(L(W.tipLbl))}</span><p>${esc(L(sel.tip))}</p></div>
      <div class="bridge"><b>${esc(L(W.bridgeT))}</b><p>${esc(L(W.bridge))}</p></div>
      <div class="actions"><button class="btn sec" data-act="games">${esc(L(G.toGames))}</button></div>
    </div>` : ""}</div>
  </section>`);
}

function renderBetter() {
  const st = story();
  put(app, `<section class="screen better">
    ${metaBar("feelsBack", L(st.name))}
    <h1>${esc(U("instead"))}</h1>
    <p class="lead">${esc(U("betterLead"))}</p>
    <div>${st.better.map((b, i) => `<div class="phrase"><p>«${esc(L(b))}»</p><button class="copy" data-copy="${i}">${esc(U("copy"))}</button></div>`).join("")}</div>
    <p class="truth">${esc(U("truth"))}</p>
    <div class="actions">
      <button class="btn pri" data-act="nextStory">${esc(U("nextStory"))} →</button>
      <button class="btn sec" data-act="home">${esc(U("toRoles"))}</button>
    </div>
  </section>`);
}

async function copyText(text, btn) {
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {}
  if (!ok) {
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    ta.remove();
  }
  btn.textContent = U("copied"); btn.classList.add("ok");
  setTimeout(() => { btn.textContent = U("copy"); btn.classList.remove("ok"); }, 1800);
}

/* ---- help sheet ---- */
function openHelp() {
  const ui = content.ui;
  put($("#modalRoot"), `<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="hT">
    <div class="sheet">
      <h2 id="hT">${esc(U("helpTitle"))}</h2>
      <p>${esc(U("helpText"))}</p>
      <ul>${L(ui.helpTips).map(t => `<li>${esc(t)}</li>`).join("")}</ul>
      ${ui.contacts.map(c => `<div class="contact"><span>${esc(L(c.name))}</span><span class="nums">${c.nums.map(n => `<a href="tel:${esc(n.tel)}">${esc(n.show)}</a>`).join("")}</span></div>`).join("")}
      <p class="note">${esc(U("contactsNote"))}</p>
      <button class="btn pri close" data-act="closeHelp">${esc(U("close"))}</button>
    </div></div>`);
  $("#modalRoot .close").focus();
}
const closeHelp = () => { $("#modalRoot").textContent = ""; $("#helpBtn").focus(); };

/* ---- events ---- */
document.addEventListener("click", e => {
  if (e.target.id === "modal") return closeHelp();
  const b = e.target.closest("button, .tapzone");
  if (!b) return;
  if (b.id === "logo") return go("home");
  if (b.id === "helpBtn") return $("#modal") ? closeHelp() : openHelp();
  if (b.id === "langBtn") {
    lang = lang === "tj" ? "ru" : "tj";
    try { localStorage.setItem("c07-lang", lang); } catch (e) {}
    clearTimers();
    render(true);
    if ($("#modal")) openHelp();
    return;
  }
  if (b.classList.contains("tapzone")) return advance();
  if (b.dataset.pop !== undefined) return popBubble(b);
  if (b.dataset.weather) {
    S.weather = b.dataset.weather;
    render(true);
    $("#wansIn").scrollIntoView({ block: "nearest", behavior: reduce ? "auto" : "smooth" });
    return;
  }
  if (b.dataset.role) return go("story", { si: content.stories.findIndex(s => s.role === b.dataset.role), shown: 0 });
  if (b.dataset.ri !== undefined) return choose(+b.dataset.ri);
  if (b.dataset.copy !== undefined) return copyText(L(story().better[+b.dataset.copy]), b);
  const act = b.dataset.act;
  if (act === "cls") {
    S.cls = !S.cls;
    if (S.screen === "feels" && S.cls && S.inner === 0) S.inner = 1;
    clearTimers(); render(true); return;
  }
  if (act === "home") return go("home");
  if (act === "adv") return advance();
  if (act === "story" || act === "retry") return go("story", {});
  if (act === "better") return go("better");
  if (act === "feelsBack") return go("feels", { inner: L(story().reactions[S.ri].feels).length });
  if (act === "nextStory") return go("story", { si: (S.si + 1) % content.stories.length, shown: 0 });
  if (act === "closeHelp") return closeHelp();
  if (act === "openHelp") return openHelp();
  if (act === "games") return go("games");
  if (act === "pop" || act === "popAgain") return go("pop", { pop: [] });
  if (act === "weather") return go("weather", { weather: null });
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("#modal")) return closeHelp();
  if (!S.cls || $("#modal")) return;
  if (e.key === "ArrowRight" || e.key === "PageDown" || (e.key === " " && !e.target.closest("button"))) { e.preventDefault(); advance(); }
});

render(false);
</script>
