<!doctype html>
<html lang="tg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121A2C">
<meta name="robots" content="noindex">
<title>Лупа — аслӣ ё қалбакӣ?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wdth,wght@62.5..100,400..900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E9EDF3; --card:#FFFFFF; --ink:#121A2C; --ink2:#4A5468; --line:#CBD3DF;
  --rose:#E23D6A; --rose-bg:#FDE7EE; --teal:#0F8A70; --teal-bg:#DDF3EC; --mark:#FFE14D;
  --sans:"Noto Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "Roboto Mono", Menlo, monospace;
  --r:14px; --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;min-height:100vh;
  background-image:radial-gradient(var(--line) 1px, transparent 1px);background-size:22px 22px;padding-bottom:96px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.wrap{max-width:520px;margin:0 auto;padding:0 16px}

header{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{display:flex;align-items:center;gap:10px;font-stretch:62.5%;font-weight:900;font-size:26px;letter-spacing:.04em;text-transform:uppercase}
.logo svg{width:30px;height:30px}
.lang{display:flex;border:2px solid #fff;border-radius:999px;overflow:hidden}
.lang button{min-height:44px;min-width:52px;padding:0 12px;font-family:var(--mono);font-weight:700;font-size:14px;color:#fff}
.lang button[aria-pressed="true"]{background:var(--mark);color:var(--ink)}

.eyebrow{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2)}
h1,h2{font-stretch:62.5%;font-weight:900;line-height:1.02;text-transform:uppercase;letter-spacing:.01em}
h1{font-size:46px}
h2{font-size:34px}
h3{font-size:19px;font-weight:800;line-height:1.25}
.lead{font-size:17px;color:var(--ink2)}
.hlt{background:linear-gradient(transparent 55%, var(--mark) 55%);padding:0 2px}
.tag{display:inline-block;font-family:var(--mono);font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--mark);color:var(--ink);text-transform:uppercase}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;padding:12px 18px;border-radius:var(--r);
  font-weight:800;font-size:17px;text-align:center;transition:transform .15s var(--ease)}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.55}
.btn-ink{background:var(--ink);color:#fff}
.btn-line{background:var(--card);border:2px solid var(--ink)}
.btn-real{background:var(--teal);color:#fff}
.btn-fake{background:var(--rose);color:#fff}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stack>*+*{margin-top:12px}
section.screen{padding:22px 0 24px;animation:enter .3s var(--ease) both}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.help{position:fixed;right:12px;bottom:max(12px, env(safe-area-inset-bottom));z-index:30;min-height:52px;padding:0 18px;border-radius:999px;
  background:var(--rose);color:#fff;font-weight:800;font-size:16px;box-shadow:0 6px 18px rgba(18,26,44,.28);display:flex;align-items:center;gap:8px}
.help svg{width:20px;height:20px}

.hero-spec{position:relative;margin:22px 0 8px;height:170px}
.hero-spec .mini{position:absolute;background:var(--card);border-radius:12px;box-shadow:0 4px 0 var(--ink);border:2px solid var(--ink);padding:10px;width:62%}
.hero-spec .m1{left:0;top:6px;transform:rotate(-4deg)}
.hero-spec .m2{right:0;top:40px;transform:rotate(3deg)}
.hero-spec .loupe{position:absolute;left:40%;top:52px;width:96px;height:96px;transform:rotate(-10deg)}
.mini .l{height:9px;border-radius:5px;background:var(--line);margin-top:7px}
.mini .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#F7B7C8,#B9C6FF)}
.home-note{font-size:14px;color:var(--ink2);display:flex;gap:8px;align-items:flex-start;background:var(--card);border-radius:12px;padding:12px 14px;border:1px solid var(--line)}
.flow{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}
.flow span{font-family:var(--mono);font-size:12px;font-weight:700;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 8px}

.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dots{display:flex;gap:5px;margin:10px 0 16px}
.dots i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.dots i.ok{background:var(--teal)} .dots i.no{background:var(--rose)} .dots i.cur{background:var(--ink)}
.q{font-stretch:75%;font-weight:900;font-size:26px;line-height:1.1;margin:14px 0 12px;text-transform:uppercase}

.flip{perspective:1400px}
.flip-in{display:grid;transition:transform .4s var(--ease);transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;position:relative}
.face.back{transform:rotateY(180deg)}
.stamp{position:absolute;right:10px;bottom:14px;z-index:5;font-family:var(--mono);font-weight:700;font-size:14px;text-transform:uppercase;
  padding:6px 10px;border:3px solid currentColor;border-radius:8px;background:rgba(255,255,255,.92);transform:rotate(6deg)}
.stamp.fake{color:var(--rose)} .stamp.real{color:var(--teal)}

.sp{background:var(--card);border-radius:var(--r);border:2px solid var(--ink);box-shadow:0 5px 0 var(--ink);overflow:hidden}
.back .sp{overflow:visible}
.anc{position:relative}
.pin{position:absolute;z-index:4;top:-10px;right:-6px;width:28px;height:28px;border-radius:50%;background:var(--mark);color:var(--ink);border:2px solid var(--ink);
  font-family:var(--mono);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;line-height:1;
  opacity:0;transform:scale(.3);animation:pop .3s var(--ease) forwards;animation-delay:var(--d,0ms)}
.pin.xy{top:auto;right:auto;margin:-14px 0 0 -14px}
.pin.xy::after{content:"";position:absolute;inset:-12px;border:2px dashed var(--ink);border-radius:50%}
.hl::before{content:"";position:absolute;inset:-4px;border:3px solid var(--rose);border-radius:10px;pointer-events:none;
  opacity:0;transform:scale(1.06);animation:ring .3s var(--ease) forwards;animation-delay:var(--d,0ms)}
.hl.ok::before{border-color:var(--teal)}
@keyframes pop{to{opacity:1;transform:scale(1)}}
@keyframes ring{to{opacity:1;transform:scale(1)}}

.pf{padding:14px}
.pf-top{display:flex;align-items:center;gap:14px}
.pf-av{width:76px;height:76px;flex:none;border-radius:50%;border:2px solid var(--line)}
.pf-av svg{width:100%;height:100%;display:block;border-radius:50%}
.pf-stats{flex:1;display:grid;grid-template-columns:repeat(3,1fr);text-align:center;padding:4px 0}
.pf-stats b{display:block;font-size:17px;font-weight:800}
.pf-stats small{font-size:12px;color:var(--ink2)}
.pf-name{font-weight:800;margin-top:10px}
.pf-handle{display:inline-block;font-family:var(--mono);font-size:13px;color:var(--ink2)}
.pf-meta{display:inline-block;font-size:13px;color:var(--ink2);margin-top:8px;padding:2px 6px;background:var(--paper);border-radius:6px}
.pf-bio{margin-top:8px;font-size:15px;padding:2px 0}
.pf-dm{margin-top:10px;background:var(--paper);border-radius:12px;padding:10px 12px;font-size:15px}
.pf-dm small{display:block;font-family:var(--mono);font-size:11px;color:var(--ink2);margin-bottom:3px;text-transform:uppercase}
.pf-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:12px}
.pf-grid div{aspect-ratio:1;border-radius:4px}
.pf-grid .empty{background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink2)}

.m-head{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#F3F5F9;border-bottom:1px solid var(--line);border-radius:12px 12px 0 0}
.m-av{width:40px;height:40px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff}
.m-head b{display:block;line-height:1.2}
.m-head small{font-size:12px;color:var(--ink2)}
.m-body{padding:14px;display:flex;flex-direction:column;gap:8px;background:#FBFCFE;border-radius:0 0 12px 12px}
.bub{max-width:86%;padding:9px 12px;border-radius:14px;font-size:15px;line-height:1.4;word-break:break-word}
.bub.them{background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px;align-self:flex-start}
.bub.me{background:#D9E4FF;border-bottom-right-radius:4px;align-self:flex-end}
.bub .who{display:block;font-size:12px;font-weight:800;color:var(--teal)}
.bub .lnk{color:#2456D6;text-decoration:underline;font-family:var(--mono);font-size:13px}
.bub .t{display:block;text-align:right;font-size:11px;color:var(--ink2);margin-top:2px}
.day{align-self:center;font-family:var(--mono);font-size:11px;color:var(--ink2);background:var(--paper);padding:2px 8px;border-radius:6px}

.frame{position:relative;line-height:0}
.frame svg{width:100%;height:auto;display:block;border-radius:12px 12px 0 0}
.cap{padding:10px 14px;font-size:15px;border-top:1px solid var(--line)}
.cap small{display:block;font-family:var(--mono);font-size:11px;color:var(--ink2);text-transform:uppercase}

.fb{margin-top:18px;animation:enter .3s var(--ease) both;animation-delay:.25s}
.verdict{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;font-weight:800;font-size:18px}
.verdict.good{background:var(--teal-bg);color:#0A5E4C}
.verdict.bad{background:var(--rose-bg);color:#A11E45}
.verdict i{font-style:normal;font-size:24px}
.clues{list-style:none;margin:14px 0}
.clues li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line);
  opacity:0;transform:translateX(-8px);animation:slide .3s var(--ease) forwards;animation-delay:var(--d,0ms)}
.clues li b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--mark);border:2px solid var(--ink);font-family:var(--mono);font-size:13px;display:flex;align-items:center;justify-content:center}
@keyframes slide{to{opacity:1;transform:none}}
.explain{background:var(--card);border-left:5px solid var(--ink);border-radius:8px;padding:12px 14px;margin-bottom:16px}

.big{font-stretch:62.5%;font-weight:900;font-size:120px;line-height:.9}
.big small{font-size:44px;color:var(--ink2)}
.bars{margin:20px 0}
.bar{margin-bottom:16px}
.bar .lbl{display:flex;justify-content:space-between;font-weight:700;margin-bottom:6px}
.bar .lbl b{font-family:var(--mono);font-size:20px}
.track{height:26px;border-radius:8px;background:var(--card);border:2px solid var(--ink);overflow:hidden}
.fill{height:100%;transform-origin:left;transform:scaleX(0);transition:transform .4s var(--ease)}
.fill.pre{background:repeating-linear-gradient(45deg,var(--ink2) 0 6px,#6B7489 6px 12px)}
.fill.post{background:var(--teal)}
.arrow{font-stretch:62.5%;font-weight:900;font-size:72px;line-height:1;display:flex;align-items:baseline;gap:12px;margin:16px 0}
.arrow .from{color:var(--ink2)}
.arrow .to{color:var(--teal)}
.arrow .sep{font-size:44px}

.sign{background:var(--card);border-radius:var(--r);border:2px solid var(--ink);padding:14px;display:grid;grid-template-columns:48px 1fr;gap:12px;
  opacity:0;transform:translateY(8px);animation:slide .3s var(--ease) forwards;animation-delay:var(--d,0ms)}
.sign .ic{width:48px;height:48px;border-radius:12px;background:var(--mark);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:20px;border:2px solid var(--ink)}
.sign p{font-size:15px;color:var(--ink2);margin-top:4px}
.sign .ex{margin-top:8px;font-size:14px;font-family:var(--mono);background:var(--paper);border-radius:8px;padding:6px 8px;color:var(--ink)}

.step{display:grid;grid-template-columns:44px 1fr;gap:12px;background:var(--card);border-radius:var(--r);padding:14px;border:2px solid var(--ink);
  opacity:0;transform:translateY(8px);animation:slide .3s var(--ease) forwards;animation-delay:var(--d,0ms)}
.step .n{width:44px;height:44px;border-radius:50%;background:var(--ink);color:#fff;font-stretch:62.5%;font-weight:900;font-size:24px;display:flex;align-items:center;justify-content:center}
.step p{font-size:15px;margin-top:4px;color:var(--ink2)}
.step ul{margin:8px 0 0 18px;font-size:15px}
.calm{background:var(--teal-bg);border-radius:var(--r);padding:14px;font-weight:700;color:#0A5E4C}
.contacts{background:var(--ink);color:#fff;border-radius:var(--r);padding:16px}
.contacts h3{margin-bottom:8px}
.contacts li{list-style:none;padding:8px 0;border-top:1px solid rgba(255,255,255,.18);font-size:15px}
.contacts .tel{display:inline-flex;align-items:center;min-height:44px;padding:0 12px;margin:4px 6px 0 0;border-radius:10px;background:var(--mark);color:var(--ink);
  font-family:var(--mono);font-weight:700;font-size:15px;text-decoration:none;white-space:nowrap}
.contacts li b{font-family:var(--mono);color:var(--mark)}
.urgent{border:3px solid var(--rose);background:var(--rose-bg);border-radius:var(--r);padding:12px 14px;font-weight:700;color:#A11E45}
.fine{font-size:13px;color:var(--ink2)}

.veil{position:fixed;inset:0;background:rgba(18,26,44,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .25s var(--ease)}
.veil.on{opacity:1;pointer-events:auto}
.sheet{background:var(--paper);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px 16px 28px;max-height:90vh;overflow:auto;
  transform:translateY(40px);transition:transform .3s var(--ease)}
.veil.on .sheet{transform:none}

/* mini-games */
.gcard{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:2px solid var(--ink);
  border-radius:var(--r);padding:14px;box-shadow:0 4px 0 var(--ink);min-height:72px;transition:transform .15s var(--ease)}
.gcard:active{transform:translateY(2px)}
.gcard .gi{width:56px;height:56px;border-radius:12px;background:var(--mark);border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:26px}
.gcard b{display:block;font-size:18px;line-height:1.2}
.gcard small{display:block;font-size:14px;color:var(--ink2);margin-top:2px}
.gcard .gt{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--ink2)}
.mp{background:var(--card);border:2px solid var(--ink);border-radius:var(--r);padding:12px;position:relative}
.mp.orig{border-style:dashed;box-shadow:none}
.mp.copy{box-shadow:0 5px 0 var(--ink)}
.mp-lbl{position:absolute;top:-12px;left:12px;font-family:var(--mono);font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--ink);color:#fff}
.mp.copy .mp-lbl{background:var(--mark);color:var(--ink);border:2px solid var(--ink)}
.mp-row{display:flex;gap:12px;align-items:center}
.part{position:relative;display:block;text-align:left;border-radius:10px;padding:6px 8px;min-height:44px;width:100%}
.mp-row .part.av{width:72px;flex:none;padding:4px}
.part.av svg{width:60px;height:60px;border-radius:50%;display:block}
.mp.copy .part{background:#F6F8FB}
.mp.copy .part+.part,.mp .part+.part{margin-top:6px}
.part .k{display:block;font-family:var(--mono);font-size:11px;color:var(--ink2);text-transform:uppercase}
.part.found::before,.part.mark::before{content:"";position:absolute;inset:-3px;border:3px solid var(--rose);border-radius:12px;pointer-events:none}
.part.mark::before{border-style:dashed;border-width:2px;opacity:.7}
.part.found.new::before{opacity:0;transform:scale(1.08);animation:ring .3s var(--ease) forwards}
.part.hint::after{content:"";position:absolute;inset:-3px;border:3px solid var(--mark);border-radius:12px;pointer-events:none;animation:hint .4s ease-in-out 6 alternate}
@keyframes hint{from{opacity:.2;transform:scale(1)}to{opacity:1;transform:scale(1.03)}}
.part .pin{top:-10px;right:-6px}
.part:not(.new) .pin{animation:none;opacity:1;transform:none}
.note{min-height:24px;font-size:15px;color:var(--ink2);margin:10px 0;opacity:0;transition:opacity .2s}
.note.on{opacity:1}
.field{position:relative;height:360px;margin:8px 0 16px}
.bubble{position:absolute;width:128px;height:128px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;
  font-weight:800;font-size:16px;line-height:1.2;color:var(--ink);border:2px solid var(--ink);
  background:radial-gradient(circle at 32% 28%, #fff 0 14%, rgba(255,255,255,.6) 15%, rgba(185,198,255,.55) 60%, rgba(226,61,106,.25) 100%);
  animation:float 3.6s ease-in-out infinite alternate;animation-delay:var(--d,0s)}
@keyframes float{from{transform:translateY(0)}to{transform:translateY(-10px)}}
.bubble.pop{animation:popout .3s var(--ease) forwards;pointer-events:none}
@keyframes popout{to{opacity:0;transform:scale(1.35)}}
.bubble.gone{visibility:hidden;opacity:0}
.answers{list-style:none}
.answers.latest{min-height:96px;margin-top:12px}
.answers li{background:var(--teal-bg);color:#0A5E4C;border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:15px;
  opacity:0;transform:translateY(8px);animation:slide .3s var(--ease) forwards}
.answers li s{display:block;text-decoration:line-through;color:var(--ink2);font-size:13px;font-weight:700}
.answers li.old{animation:none;opacity:1;transform:none}
.endbox{background:var(--card);border:2px solid var(--ink);border-radius:var(--r);padding:16px;margin-top:14px;animation:enter .3s var(--ease) both}

@media (prefers-reduced-motion: reduce){
  .answers li,.part.found::before{opacity:1 !important;transform:none !important}
  .bubble.pop{opacity:0;visibility:hidden}
  *,*::before,*::after{animation:none !important;transition:none !important}
  .pin,.clues li,.sign,.step,.hl::before{opacity:1 !important;transform:none !important}
  .flip.on .flip-in{transform:rotateY(180deg) !important}
}
@media (max-width:360px){ h1{font-size:40px} .big{font-size:100px} }
</style>
</head>
<body>
<header><div class="wrap">
  <div class="logo">
    <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="13" cy="13" r="9" fill="none" stroke="#FFE14D" stroke-width="3.5"/><path d="M20 20l8 8" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg>
    <span id="brand">Лупа</span>
  </div>
  <div class="lang" role="group" aria-label="Забон / Язык">
    <button data-lang="tj" aria-pressed="true">TJ</button><button data-lang="ru" aria-pressed="false">RU</button>
  </div>
</div></header>

<main class="wrap" id="app" aria-live="polite"></main>

<button class="help" data-act="help" id="helpBtn">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 7.5v6M12 16.8v.2"/></svg>
  <span id="helpLbl"></span>
</button>

<div class="veil" id="veil" aria-hidden="true">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" id="sheet"></div>
</div>

<script>
/* ================= CONTENT (all texts, separate from logic) ================= */
const content = {
  ui: {
    tj: {
      brand:"Лупа", help:"Ба ман кӯмак лозим",
      homeEyebrow:"Машқ барои 13–24 сола",
      homeTitle:"Ба аслӣ монанд аст.", homeTitle2:"Аммо ҳаст?",
      homeLead:"Профилҳо, паёмҳо ва тасвирҳоро ИИ ва фиребгарон месозанд. Дар 5 дақиқа санҷ, ки чандтоашро мешиносӣ.",
      flow:["5 корт","6 аломат","5 корт","буд → шуд"],

const KEY = "lupa.v1";
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify({lang:S.lang, pre:S.pre, post:S.post})); }catch(e){} }
const saved = load();
const S = { lang: saved.lang === "ru" ? "ru" : "tj", screen:"home", set:"pre", idx:0, res:[], answered:false, fromCompare:false, g:null, b:{popped:[]},
            pre: typeof saved.pre === "number" ? saved.pre : null, post: typeof saved.post === "number" ? saved.post : null };
const reduce = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
const $app = document.getElementById("app");

const U = () => content.ui[S.lang];
const t = v => (v && typeof v === "object" && ("tj" in v || "ru" in v)) ? v[S.lang] : (v == null ? "" : v);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const setCards = set => content.cards.filter(c => c.set === set);
/* All markup is built from the static `content` object above (no user input); text fields go through esc(). */
function html(el, markup){ el.replaceChildren(document.createRange().createContextualFragment(markup)); }

function go(screen, extra){ clearTimeout(hintTimer); Object.assign(S, {screen}, extra || {}); render(); window.scrollTo(0,0); }

/* ---- specimen renderers ---- */
function profile(c){
  const st = c.stats;
  const lab = S.lang === "tj" ? ["пост","обуначӣ","обуна"] : ["постов","подписчиков","подписок"];
  const tiles = c.tiles && c.tiles.length
    ? c.tiles.map(col => `<div style="background:${col}"></div>`).join("") + (c.tiles.length < 3 ? '<div class="empty"></div>'.repeat(3 - c.tiles.length) : "")
    : `<div class="empty">—</div><div class="empty">—</div><div class="empty">—</div>`;
  return `<div class="sp"><div class="pf">
    <div class="pf-top"><div class="pf-av anc" data-k="avatar">${art[c.avatar]}</div>
      <div class="pf-stats anc" data-k="stats"><div><b>${esc(t(st.posts))}</b><small>${lab[0]}</small></div><div><b>${esc(t(st.followers))}</b><small>${lab[1]}</small></div><div><b>${esc(t(st.following))}</b><small>${lab[2]}</small></div></div></div>
    <div class="pf-name">${esc(t(c.name))}</div>
    <div class="pf-handle anc" data-k="handle">@${esc(c.handle)}</div><br>
    <div class="pf-meta anc" data-k="created">🕓 ${esc(t(c.created))}</div>
    <div class="pf-bio anc" data-k="bio">${esc(t(c.bio))}</div>
    ${c.dm ? `<div class="pf-dm anc" data-k="dm"><small>${esc(t(c.dmLbl))}</small>${esc(t(c.dm))}</div>` : ""}
    <div class="pf-grid">${tiles}</div></div></div>`;
}
function message(c){
  const b = c.bubbles.map(m => {
    if (m.day) return `<div class="day">${esc(t(m.day))}</div>`;
    const txt = t(m.text);
    return `<div class="bub ${m.from} anc" ${m.k ? `data-k="${m.k}"` : ""}>${m.who ? `<span class="who">${esc(t(m.who))}</span>` : ""}${esc(txt)}${m.link ? `${txt ? "<br>" : ""}<span class="lnk">${esc(m.link)}</span>` : ""}<span class="t">${m.t}</span></div>`;
  }).join("");
  return `<div class="sp"><div class="m-head anc" data-k="sender"><div class="m-av" style="background:${c.color}">${esc(c.initial)}</div><div><b>${esc(t(c.sender))}</b><small>${esc(t(c.sub))}</small></div></div><div class="m-body">${b}</div></div>`;
}
function image(c){
  return `<div class="sp"><div class="frame">${art[c.scene]}</div><div class="cap anc" data-k="cap"><small>${esc(t(c.capLbl))}</small>${esc(t(c.cap))}</div></div>`;
}
const specimen = c => ({profile, message, image})[c.type](c);

screens.games = function(){
  const g = G();
  const card = (act, icon, title, desc) => `<button class="gcard" data-act="${act}"><span class="gi" aria-hidden="true">${icon}</span><span><b>${title}</b><small>${desc}</small></span><span class="gt">${g.min}</span></button>`;

function miniAvatar(av){
  if (av.glossy) return art.glossy;
  return `<svg viewBox="0 0 80 80"><rect width="80" height="80" fill="${av.c}"/><text x="40" y="52" text-anchor="middle" font-family="Noto Sans,Arial" font-weight="800" font-size="34" fill="#121A2C">${esc(av.l)}</text></svg>`;
}
function miniProfile(p, side, round){
  const g = G(), lab = S.lang === "tj" ? ["пост","обуначӣ"] : ["постов","подписчиков"];
  const found = S.g.found, isCopy = side === "copy";
  const inner = {
    avatar: miniAvatar(p.av),
    name: `<b>${esc(t(p.name))}</b>`,
    handle: `<span style="font-family:var(--mono);font-size:14px">@${esc(p.handle)}</span>`,
    stats: `<span class="k">${S.lang === "tj" ? "Рақамҳо" : "Цифры"}</span>${esc(t(p.posts))} ${lab[0]} · ${esc(t(p.followers))} ${lab[1]}`,
    created: `<span class="k">${S.lang === "tj" ? "Сохта шуд" : "Создан"}</span>🕓 ${esc(t(p.created))}`,
    bio: `<span class="k">Bio</span>${esc(t(p.bio))}`
  };
  const part = k => {
    const n = found.indexOf(k);
    const cls = "part" + (k === "avatar" ? " av" : "") + (n >= 0 ? (isCopy ? " found" : " mark") : "") + (isCopy && n >= 0 && n === S.g.newest ? " new" : "") + (isCopy && S.g.hint === k ? " hint" : "");
    const pin = isCopy && n >= 0 ? `<span class="pin">${n + 1}</span>` : "";
    return isCopy
      ? `<button class="${cls}" data-act="part" data-part="${k}">${inner[k]}${pin}</button>`
      : `<div class="${cls}">${inner[k]}</div>`;
  };
  return `<div class="mp ${side}"><span class="mp-lbl">${isCopy ? g.copy : g.orig}</span>
    <div class="mp-row" style="margin-top:6px">${part("avatar")}<div style="flex:1;min-width:0">${part("name")}${part("handle")}</div></div>
    ${part("stats")}${part("created")}${part("bio")}</div>`;
}
function spotBody(){
  const g = G(), r = content.games.spot[S.g.round], keys = Object.keys(r.diffs), done = S.g.found.length === 3;
  const last = S.g.round === 2;
  return `<div class="qhead"><span class="eyebrow">${g.round.replace("{n}", S.g.round + 1)}</span><span class="tag">${g.found.replace("{n}", S.g.found.length)}</span></div>
    <div class="dots">${keys.map((_, i) => `<i class="${i < S.g.found.length ? "ok" : ""}"></i>`).join("")}</div>
    <div class="stack" style="margin-top:22px">${miniProfile(r.orig, "orig")}<div style="height:10px"></div>${miniProfile(r.copy, "copy")}</div>
    <p class="note" id="note" aria-live="polite"></p>
    <ol class="clues">${S.g.found.map((k, i) => `<li style="${i === S.g.newest ? "" : "animation:none;opacity:1;transform:none"}"><b>${i + 1}</b><span>${esc(t(r.diffs[k]))}</span></li>`).join("")}</ol>
    ${done ? (last
      ? `<div class="endbox"><h3>🎉 ${g.spotEnd}</h3><p style="margin:8px 0 14px">${g.spotEndText}</p><div class="stack"><button class="btn btn-ink" data-act="plan">${U().toPlan} →</button><button class="btn btn-line" data-act="games">${g.back}</button></div></div>`
      : `<button class="btn btn-ink" data-act="nextRound">${g.nextRound} →</button>`)
      : `<button class="btn btn-line" data-act="hint" id="hintBtn" ${S.g.hintReady ? "" : "hidden"}>💡 ${g.hint}</button>`}`;
}
screens.spot = function(){
  const g = G();
  return `<section class="screen"><h2 class="q">${g.spotTitle}</h2><p class="lead">${g.spotDesc}</p><div id="spotBody">${spotBody()}</div></section>`;
};
function armHint(){
  clearTimeout(hintTimer);
  if (S.g.hintReady) return;
  hintTimer = setTimeout(() => { S.g.hintReady = true; const h = document.getElementById("hintBtn"); if (h) h.hidden = false; }, 12000);
}
function startSpot(round){ S.g = {round, found:[], newest:-1, hint:null, hintReady:false}; go("spot"); armHint(); }
function refreshSpot(){ html(document.getElementById("spotBody"), spotBody()); }
function spotTap(k){
  const r = content.games.spot[S.g.round];
  if (S.g.found.length === 3) return;
  if (r.diffs[k] && !S.g.found.includes(k)){
    S.g.found.push(k); S.g.newest = S.g.found.length - 1; S.g.hint = null;
    refreshSpot();
  } else if (!r.diffs[k]) {
    const n = document.getElementById("note"); n.textContent = G().same; n.classList.add("on");
  }
}
function spotHint(){
  const r = content.games.spot[S.g.round];
  S.g.hint = Object.keys(r.diffs).find(k => !S.g.found.includes(k)) || null;
  S.g.newest = -1; refreshSpot();
}

const POS = [{l:2,t:2},{l:56,t:8},{l:29,t:35},{l:3,t:64},{l:56,t:62}];
screens.bubbles = function(){
  const g = G(), W = content.games.worries, left = W.length - S.b.popped.length;
  return `<section class="screen">
    <h2 class="q">${g.bubTitle}</h2>
    <p class="lead" style="margin-bottom:10px">${g.bubLead}</p>
    <p class="tag" id="left">${g.left.replace("{n}", left)}</p>
    <ul class="answers latest" id="latest">${left > 0 && S.b.popped.length ? answerLi(S.b.popped[S.b.popped.length - 1], true) : ""}</ul>
    <div class="field" id="field" ${left === 0 ? "hidden" : ""}>${W.map((w, i) => `<button class="bubble ${S.b.popped.includes(i) ? "gone" : ""}" data-act="pop" data-i="${i}" style="left:${POS[i].l}%;top:${POS[i].t}%;--d:${(i * 0.7).toFixed(1)}s">${esc(t(w.w))}</button>`).join("")}</div>
    <ul class="answers" id="answers">${left === 0 ? S.b.popped.map(i => answerLi(i, true)).join("") : ""}</ul>
    <div id="bubEnd">${left === 0 ? bubEnd() : ""}</div>
  </section>`;
};
function answerLi(i, old){ const w = content.games.worries[i]; return `<li class="${old ? "old" : ""}"><s>${esc(t(w.w))}</s>${esc(t(w.a))}</li>`; }
function bubEnd(){
  const g = G();
  return `<div class="endbox"><h3>${g.bubEnd}</h3><p style="margin:8px 0 14px">${g.bubEndText}</p><div class="stack">
    <button class="btn btn-ink" data-act="plan">${U().toPlan} →</button>
    <button class="btn btn-line" data-act="bubbles">${g.again}</button>
    <button class="btn btn-line" data-act="games">${g.back}</button></div></div>`;
}
function pop(i, el){
  if (S.b.popped.includes(i)) return;
  S.b.popped.push(i);
  el.classList.add("pop");
  setTimeout(() => el.classList.add("gone"), reduce ? 0 : 300);
  const left = content.games.worries.length - S.b.popped.length;
  document.getElementById("left").textContent = G().left.replace("{n}", left);
  if (left > 0) { html(document.getElementById("latest"), answerLi(i, false)); return; }
  setTimeout(() => {
    document.getElementById("latest").replaceChildren();
    document.getElementById("field").hidden = true;
    html(document.getElementById("answers"), S.b.popped.map(j => answerLi(j, j !== i)).join(""));
    html(document.getElementById("bubEnd"), bubEnd());
  }, reduce ? 0 : 300);
}

function render(){
  const u = U();
  document.documentElement.lang = S.lang === "tj" ? "tg" : "ru";
  document.getElementById("brand").textContent = u.brand;
  document.getElementById("helpLbl").textContent = u.help;
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === S.lang)));
  html($app, screens[S.screen]());
  if (S.screen === "quiz" && S.answered) showAnswer(true);
  if (S.screen === "preResult") countTo(document.getElementById("cnt"), 0, S.pre);
  if (S.screen === "compare") runCompare();
  if (document.getElementById("veil").classList.contains("on")) renderSheet();
}

/* ---- answer / flip / clue reveal ---- */
function showAnswer(instant){
  const u = U(), c = setCards(S.set)[S.idx], ok = S.res[S.idx];
  const back = document.getElementById("back");
  html(back, specimen(c) + `<div class="stamp ${c.isFake ? "fake" : "real"}">${c.isFake ? u.stampFake : u.stampReal}</div>`);
  back.removeAttribute("aria-hidden");
  document.querySelector(".front").setAttribute("aria-hidden", "true");
  const base = (instant || reduce) ? 0 : 450;
  c.clues.forEach((cl, i) => {
    const d = (base + i * 380) + "ms";
    const pin = document.createElement("span");
    pin.className = "pin"; pin.textContent = i + 1; pin.style.setProperty("--d", d);
    if (cl.at){
      const el = back.querySelector(`[data-k="${cl.at}"]`);
      if (!el) return;
      el.classList.add("hl"); if (cl.ok) el.classList.add("ok");
      el.style.setProperty("--d", d); el.appendChild(pin);
    } else {
      pin.classList.add("xy"); pin.style.left = cl.x + "%"; pin.style.top = cl.y + "%";
      back.querySelector(".frame").appendChild(pin);
    }
  });
  const flip = document.getElementById("flip");
  if (instant) flip.classList.add("on"); else requestAnimationFrame(() => requestAnimationFrame(() => flip.classList.add("on")));
  const act = document.getElementById("act");
  act.replaceChildren(); act.style.display = "none";
  html(document.getElementById("fb"), `<div class="fb">
    <div class="verdict ${ok ? "good" : "bad"}"><i aria-hidden="true">${ok ? "✓" : "✕"}</i><span>${ok ? u.good : u.bad} · ${c.isFake ? u.isFake : u.isReal}</span></div>
    <p class="eyebrow" style="margin-top:14px">${c.isFake ? u.cluesFake : u.cluesReal}</p>
    <ol class="clues">${c.clues.map((cl, i) => `<li style="--d:${base + i * 380}ms"><b>${i + 1}</b><span>${esc(t(cl.text))}</span></li>`).join("")}</ol>
    <p class="explain">${esc(t(c.explain))}</p>
    <button class="btn btn-ink" data-act="next">${S.idx === 4 ? u.finish : u.next} →</button></div>`);
}

function answer(v){
  if (S.answered) return;
  const c = setCards(S.set)[S.idx];
  S.res[S.idx] = (v === "fake") === c.isFake;
  S.answered = true;
  showAnswer(false);
}

function next(){
  if (S.idx < 4){ S.idx++; S.answered = false; render(); window.scrollTo(0,0); return; }
  const score = S.res.filter(Boolean).length;
  if (S.set === "pre"){ S.pre = score; S.post = null; save(); go("preResult"); }
  else { S.post = score; save(); go("compare"); }
}

/* ---- counters: number ticks up, bars grow with CSS transform ---- */
function countTo(el, from, to, cb){
  if (!el) return;
  if (reduce || from >= to){ el.textContent = to; cb && cb(); return; }
  let v = from; el.textContent = v;
  const step = () => { v++; el.textContent = v; if (v < to) setTimeout(step, 160); else cb && cb(); };
  setTimeout(step, 200);
}
function runCompare(){
  const bPre = document.getElementById("bPre"), bPost = document.getElementById("bPost");
  const preEl = document.getElementById("cPre"), postEl = document.getElementById("cPost");
  requestAnimationFrame(() => requestAnimationFrame(() => { bPre.style.transform = `scaleX(${S.pre / 5})`; }));
  countTo(preEl, 0, S.pre, () => {
    postEl.textContent = S.pre;
    setTimeout(() => { bPost.style.transform = `scaleX(${S.post / 5})`; }, 120);
    countTo(postEl, S.pre, S.post, () => { postEl.textContent = S.post; });
  });
}

/* ---- help sheet (available on every screen) ---- */
function renderSheet(){
  const u = U(), c = content.contacts[S.lang];
  html(document.getElementById("sheet"), `
    <h2 id="sheetTitle" style="font-size:30px;margin-bottom:10px">${u.helpTitle}</h2>
    <p style="margin-bottom:14px">${u.helpText}</p>
    <div class="contacts" style="margin-bottom:14px"><ul>${contactItems(c)}</ul><p class="fine" style="color:#AEB6C6;margin-top:6px">${u.contactsNote}</p></div>
    <div class="stack"><button class="btn btn-ink" data-act="sheetPlan">${u.openPlan}</button><button class="btn btn-line" data-act="close">${u.close}</button></div>`);
}
function contactItems(c){
  return c.map(x => `<li>${esc(x.l)}: ${x.n ? x.n.map(([shown, tel]) => `<a class="tel" href="tel:${tel}">${esc(shown)}</a>`).join(" ") : `<b>${esc(x.v)}</b>`}</li>`).join("");
}
let lastFocus = null;
function openSheet(){ lastFocus = document.activeElement; renderSheet(); const v = document.getElementById("veil"); v.classList.add("on"); v.removeAttribute("aria-hidden"); setTimeout(() => { const b = v.querySelector("button"); b && b.focus(); }, 50); }
function closeSheet(){ const v = document.getElementById("veil"); if (!v.classList.contains("on")) return; v.classList.remove("on"); v.setAttribute("aria-hidden", "true"); lastFocus && lastFocus.focus && lastFocus.focus(); }

/* ---- events ---- */
document.addEventListener("click", e => {
  if (e.target.id === "veil"){ closeSheet(); return; }
  const lb = e.target.closest("[data-lang]");
  if (lb){ S.lang = lb.dataset.lang; save(); render(); return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act;
  if (a === "start" || a === "restart") go("quiz", {set:"pre", idx:0, res:[], answered:false, fromCompare:false});
  else if (a === "ans") answer(b.dataset.v);
  else if (a === "next") next();
  else if (a === "lesson") go("lesson", {fromCompare:false});
  else if (a === "post") go("quiz", {set:"post", idx:0, res:[], answered:false});
  else if (a === "reread") go("lesson", {fromCompare:true});
  else if (a === "plan") go("plan");
  else if (a === "home") go("home");
  else if (a === "games") go("games");
  else if (a === "spot") startSpot(0);
  else if (a === "nextRound") startSpot(S.g.round + 1);
  else if (a === "part") spotTap(b.dataset.part);
  else if (a === "hint") spotHint();
  else if (a === "bubbles") go("bubbles", {b:{popped:[]}});
  else if (a === "pop") pop(+b.dataset.i, b);
  else if (a === "help") openSheet();
  else if (a === "close") closeSheet();
  else if (a === "sheetPlan"){ closeSheet(); go("plan"); }
  else if (a === "reset"){ S.pre = null; S.post = null; save(); b.textContent = U().resetDone; b.disabled = true; }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

render();
</script>
</body>
</html>
