<!doctype html>
<html lang="tg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B1A3A">
<meta name="robots" content="noindex">
<title>Стоп-кадр</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wdth,wght@75..100,400..800&family=Noto+Sans+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1FB;      /* холодная фотобумага */
  --ink:#1B1A3A;        /* индиго */
  --ink-2:#4A4970;
  --rec:#E8401F;        /* красная точка записи */
  --go:#13895C;
  --wait:#B57C00;
  --card:#FFFFFF;
  --line:#C9CDE6;
  --sans:"Noto Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"Noto Sans Mono",ui-monospace,"Roboto Mono",monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);font-size:17px;line-height:1.45;color:var(--ink);
  background:var(--paper);min-height:100vh;min-height:100dvh;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));
}
button,a{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--rec);outline-offset:3px;border-radius:6px}
h1:focus,h2:focus{outline:none}

/* шапка */
.top{
  position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:8px 16px;
}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-stretch:75%;font-size:22px;letter-spacing:.01em;text-transform:uppercase}
.dot{width:12px;height:12px;border-radius:50%;background:var(--rec);box-shadow:0 0 0 3px rgba(232,64,31,.3)}
.lang{display:flex;border:2px solid rgba(255,255,255,.35);border-radius:999px;padding:2px}
.lang button{min-width:52px;min-height:44px;border-radius:999px;font-family:var(--mono);font-weight:700;font-size:15px;color:rgba(255,255,255,.8)}
.lang button[aria-pressed="true"]{background:#fff;color:var(--ink)}

main{max-width:520px;margin:0 auto;padding:18px 16px 8px}

/* видоискатель — фирменный элемент */
.vf{position:relative;padding:22px 18px 20px}
.vf::before,.vf::after,.vf>.c1,.vf>.c2{content:"";position:absolute;width:26px;height:26px;border:0 solid var(--ink);pointer-events:none}
.vf::before{top:0;left:0;border-top-width:4px;border-left-width:4px}
.vf::after{top:0;right:0;border-top-width:4px;border-right-width:4px}
.vf>.c1{bottom:0;left:0;border-bottom-width:4px;border-left-width:4px}
.vf>.c2{bottom:0;right:0;border-bottom-width:4px;border-right-width:4px}
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin-bottom:14px}
.hud .r{display:flex;align-items:center;gap:6px;color:var(--rec)}
.hud .r i{width:8px;height:8px;border-radius:50%;background:var(--rec)}

h1,h2{font-weight:800;font-stretch:75%;line-height:1.04;letter-spacing:-.005em}
h1{font-size:clamp(36px,10.5vw,50px);text-transform:uppercase}
h2{font-size:clamp(27px,7.6vw,34px)}
.lead{margin-top:12px;color:var(--ink-2);font-size:17px}

/* экран */
.screen{animation:in .32s var(--ease) both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* выбор типа */
.types{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.type{
  min-height:124px;background:var(--card);border:2px solid var(--ink);border-radius:14px;
  padding:14px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:10px;
  box-shadow:4px 4px 0 var(--ink);transition:transform .15s var(--ease),box-shadow .15s var(--ease);
  animation:in .3s var(--ease) both;
}
.type:nth-child(2){animation-delay:.05s}.type:nth-child(3){animation-delay:.1s}.type:nth-child(4){animation-delay:.15s}
.type:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.type svg{width:34px;height:34px}
.type b{font-size:17px;line-height:1.2;font-weight:700}
.privacy{margin-top:18px;font-size:14px;color:var(--ink-2);display:flex;gap:8px;align-items:flex-start}
.privacy svg{flex:none;margin-top:2px}

/* вопрос */
.frames{display:flex;gap:6px;margin-bottom:18px}
.frames span{flex:1;height:8px;border-radius:2px;background:var(--line);transform-origin:left}
.frames span.on{background:var(--ink)}
.frames span.now{background:var(--rec);animation:grow .3s var(--ease) both}
@keyframes grow{from{transform:scaleX(.2)}to{transform:scaleX(1)}}
.q{animation:slide .3s var(--ease) both}
@keyframes slide{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
.q h2{min-height:3.15em}
.q .hint{margin-top:10px;color:var(--ink-2);font-size:16px;min-height:2.9em}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.yn button{
  min-height:64px;border-radius:14px;font-weight:800;font-size:22px;font-stretch:75%;text-transform:uppercase;letter-spacing:.03em;
  border:2px solid var(--ink);background:var(--card);box-shadow:4px 4px 0 var(--ink);
  transition:transform .15s var(--ease),box-shadow .15s var(--ease);
}
.yn button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.yn .yes{background:var(--ink);color:#fff}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.row .hud{margin:0}
.ghost{min-height:48px;padding:0 6px;font-weight:600;color:var(--ink-2);text-decoration:underline;text-underline-offset:4px}

/* результат */
.meter{margin:6px 0 18px}
.meter .lbl{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);display:flex;justify-content:space-between;gap:8px}
.bars{display:flex;gap:5px;margin-top:8px;height:22px}
.bars span{flex:1;border-radius:3px;background:var(--line);position:relative;overflow:hidden}
.bars span::after{content:"";position:absolute;inset:0;background:var(--lvl,var(--ink));transform:scaleY(0);transform-origin:bottom;transition:transform .25s var(--ease)}
.bars span.f::after{transform:scaleY(1)}
.stamp{
  display:inline-block;margin-bottom:12px;padding:6px 12px;border:3px solid currentColor;border-radius:8px;
  font-family:var(--mono);font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;
  transform:rotate(-3deg);animation:stamp .3s var(--ease) .15s both;
}
@keyframes stamp{from{opacity:0;transform:rotate(-3deg) scale(1.4)}to{opacity:1;transform:rotate(-3deg) scale(1)}}
.v-green{color:var(--go)}.v-amber{color:var(--wait)}.v-red{color:var(--rec)}
.fixes{list-style:none;margin-top:20px;display:grid;gap:10px}
.fixes li{background:var(--card);border-left:5px solid var(--rec);border-radius:10px;padding:14px;animation:in .3s var(--ease) both}
.fixes li:nth-child(2){animation-delay:.06s}.fixes li:nth-child(3){animation-delay:.12s}.fixes li:nth-child(4){animation-delay:.18s}.fixes li:nth-child(5){animation-delay:.24s}
.fixes li.mid{border-left-color:var(--wait)}
.fixes small{display:block;font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);margin-bottom:4px}
.habit{margin-top:20px;padding:14px;border:2px dashed var(--ink-2);border-radius:12px;font-size:16px}
.habit b{display:block;font-weight:800;font-stretch:75%;font-size:19px;text-transform:uppercase;margin-bottom:4px}
.btn{
  display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;margin-top:20px;border-radius:14px;
  background:var(--ink);color:#fff;font-weight:700;font-size:18px;transition:transform .15s var(--ease);
}
.btn:active{transform:scale(.97)}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--ink);margin-top:10px}

/* помощь: всегда на месте, без анимации */
.helpbar{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--paper) 70%,rgba(238,241,251,0))}
.help{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:488px;margin:0 auto;min-height:56px;border-radius:14px;background:var(--rec);color:#fff;font-weight:800;font-size:18px}
.sheet{position:fixed;inset:0;z-index:10;display:none}
.sheet.open{display:block}
.sheet .bg{position:absolute;inset:0;background:rgba(27,26,58,.55);animation:fade .2s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet .panel{
  position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--paper);
  border-radius:20px 20px 0 0;padding:22px 16px calc(22px + env(safe-area-inset-bottom));
  animation:up .3s var(--ease) both;
}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.panel .inner{max-width:488px;margin:0 auto}
.panel h2{color:var(--rec)}
.steps{margin:14px 0 6px;padding-left:22px;display:grid;gap:8px}
.contact{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border-radius:12px;padding:12px 14px;margin-top:10px;min-height:64px}
.contact span{font-weight:600;font-size:16px}
.contact a{flex:none;min-height:48px;min-width:112px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:var(--ink);color:#fff;text-decoration:none;font-family:var(--mono);font-weight:700}
.note{font-size:14px;color:var(--ink-2);margin-top:10px}

/* мини-игры */
.type.wide{grid-column:1/-1;min-height:76px;flex-direction:row;align-items:center;justify-content:flex-start;gap:14px;background:var(--ink);color:#fff}
.type.wide.light{background:var(--card);color:var(--ink);margin-top:12px;width:100%}
.type.wide span{display:flex;flex-direction:column;gap:2px}
.type.wide small{font-size:14px;font-weight:400;opacity:.8}
.scene{position:relative;margin-top:16px;border:2px solid var(--ink);border-radius:12px;overflow:hidden;background:#DDE3F5}
.scene svg{display:block;width:100%;height:auto}
.spot{position:absolute;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%}
.spot::after{content:"";position:absolute;inset:4px;border:3px solid var(--rec);border-radius:50%;opacity:0;transform:scale(1.5);transition:opacity .25s,transform .25s var(--ease)}
.spot.found::after{opacity:1;transform:scale(1);background:rgba(232,64,31,.14)}
.spot.hint:not(.found)::after{opacity:.8;transform:scale(1);border-style:dashed;border-color:var(--ink)}
.fcount{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.fcount .hud{margin:0}
.info{margin-top:12px;background:var(--card);border-radius:12px;padding:14px;border-left:5px solid var(--rec);animation:in .3s var(--ease) both}
.info h3{font-size:19px;font-weight:800;font-stretch:75%;text-transform:uppercase;margin-bottom:8px}
.info small{display:block;font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);margin-top:8px}
.info.done{border-left-color:var(--go)}
.bridge{margin-top:12px;padding:12px 14px;border:2px dashed var(--ink-2);border-radius:12px;font-size:16px}
.breath{display:grid;justify-items:center;gap:12px;margin-top:8px;text-align:center}
.blabel{font-weight:700;font-size:19px;min-height:1.5em}
.ballwrap{position:relative;width:190px;height:190px;display:grid;place-items:center}
.ball{width:190px;height:190px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0,#AEBBF3 28%,#3D4AA8 75%,var(--ink) 100%);transform:scale(.42);transition:transform 4s linear}
.ball.in{transform:scale(1)}
.bnum{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:30px;color:#fff;pointer-events:none}
.bdots{display:flex;gap:10px}
.bdots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink)}
.bdots i.on{background:var(--ink)}
.hold{width:100%;min-height:64px;border-radius:14px;background:var(--ink);color:#fff;font-weight:800;font-size:19px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;transition:transform .15s var(--ease)}
.hold.on{transform:scale(.96)}
.bdone{font-weight:800;font-size:22px;font-stretch:75%;text-transform:uppercase;color:var(--go);animation:in .3s var(--ease) both}
.breathbox{background:var(--card);border-radius:14px;padding:14px;margin-top:14px}
.breathbox .btn{margin-top:12px}

footer{max-width:520px;margin:18px auto 0;padding:0 16px 12px;font-size:13px;color:var(--ink-2)}
footer b{color:var(--ink)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>

    `<div class="hud"><span class="r"><i></i>REC</span><span>1 / 3</span></div>`,
    `<h1>${esc(t.start.title)}</h1><p class="lead">${esc(t.start.lead)}</p>
     <div class="types">${cards}
       <button type="button" class="type wide" data-games>${icons.game}<span><b>${esc(t.games.card)}</b><small>${esc(t.games.cardSub)}</small></span></button>
     </div>
     <p class="privacy">${icons.lock}<span>${esc(t.start.privacy)}</span></p>`));
}

function renderQuestion() {
  const t = T(), qs = t.types[state.type].qs, q = qs[state.i];
  const frames = qs.map((_, n) => `<span class="${n < state.i ? "on" : n === state.i ? "now" : ""}"></span>`).join("");
  put(app, vf(
    `<div class="hud"><span>${esc(t.types[state.type].name)}</span><span>2 / 3</span></div>`,
    `<div class="frames" role="img" aria-label="${state.i + 1} ${esc(t.q.of)} ${qs.length}">${frames}</div>
     <div class="q">
       <h2>${esc(q.q)}</h2><p class="hint">${esc(q.hint)}</p>
       <div class="yn">
         <button type="button" class="yes" data-ans="1">${esc(t.q.yes)}</button>
         <button type="button" data-ans="0">${esc(t.q.no)}</button>
       </div>
     </div>
     <div class="row"><button type="button" class="ghost" data-back>← ${esc(t.q.back)}</button>
       <span class="hud">${state.i + 1} ${esc(t.q.of)} ${qs.length}</span></div>`));
}

function verdict() {
  const qs = T().types[state.type].qs;
  let score = 0, high = false;
  state.answers.forEach((a, n) => { if (a) { score += qs[n].w; if (qs[n].w > 1) high = true; } });
  const level = score === 0 ? "green" : (high || score >= 3) ? "red" : "amber";
  return { score, level };
}

function renderResult() {
  const t = T(), qs = t.types[state.type].qs, { score, level } = verdict(), v = t.result.verdicts[level];
  const col = { green: "var(--go)", amber: "var(--wait)", red: "var(--rec)" }[level];
  const total = 7, n = Math.max(1, Math.min(total, score)); // шкала из 7 делений
  const bars = Array.from({ length: total }, () => `<span style="--lvl:${col}"></span>`).join("");
  const fixes = qs.map((q, k) => state.answers[k]
    ? `<li class="${q.w > 1 ? "" : "mid"}"><small>${esc(q.w > 1 ? t.result.high : t.result.mid)}</small>${esc(q.fix)}</li>` : "").join("");
  put(app, vf(
    `<div class="hud"><span>${esc(t.types[state.type].name)}</span><span>3 / 3</span></div>`,
    `<div class="meter"><div class="lbl"><span>${esc(t.result.meter)}</span><span>${score === 0 ? esc(t.result.low) : score >= 4 ? esc(t.result.much) : ""}</span></div>
       <div class="bars" role="img" aria-label="${score} / ${total}">${bars}</div></div>
     <span class="stamp v-${level}">${esc(v.stamp)}</span>
     <h2>${esc(v.title)}</h2><p class="lead">${esc(v.text)}</p>
     ${fixes ? `<ul class="fixes" aria-label="${esc(t.result.fixTitle)}">${fixes}</ul>` : ""}
     <div class="habit"><b>${esc(t.result.habitT)}</b>${esc(t.result.habit)}</div>
     <button type="button" class="btn" data-restart>${esc(t.result.again)}</button>
     <button type="button" class="btn alt" data-redo>${esc(t.result.redo)}</button>`));
  // шкала заполняется по одному делению (только transform)
  const spans = app.querySelectorAll(".bars span");
  requestAnimationFrame(() => requestAnimationFrame(() => spans.forEach((s, k) => {
    if (k < n) { s.style.transitionDelay = (k * 40) + "ms"; s.classList.add("f"); }
  })));
}

/* ===== Мини-игры ===== */
function renderGames() {

     <div class="row"><button type="button" class="ghost" data-home>← ${esc(g.back)}</button></div>`));
}

function findInfoHTML() {
  const f = T().find, ids = Object.keys(SPOTS);
  let html = "";
  if (find.last) {
    const s = f.spots[find.last];
    html += `<div class="info"><h3>${esc(s.name)}</h3><small>${esc(f.learn)}</small>${esc(s.learn)}<small>${esc(f.hide)}</small>${esc(s.hide)}</div>`;
  }

function findCountHTML() {

  put(app, vf(
    `<div class="hud"><span class="r"><i></i>${esc(t.games.title)}</span></div>`,

     <div class="scene">${SCENE}${spots}</div>

     <div data-finfo></div>
     <div class="row"><button type="button" class="ghost" data-games>← ${esc(t.games.toGames)}</button></div>`));
  updateFind();
}
function updateFind() {
  app.querySelectorAll(".spot").forEach(b => {
    b.classList.toggle("found", find.found.includes(b.dataset.spot));
    b.classList.toggle("hint", find.hint === b.dataset.spot);
  });
  const c = app.querySelector("[data-fcount]"), i = app.querySelector("[data-finfo]");
  if (c) put(c, findCountHTML());
  if (i) put(i, findInfoHTML());
}

/* Игра 2: «Шарик-дыхание» — 3 раунда, проиграть нельзя */
const breath = { round: 0, phase: "idle", count: 0, t0: 0, iv: null, to: null };
function bReset() { clearInterval(breath.iv); clearTimeout(breath.to); Object.assign(breath, { round: 0, phase: "idle", count: 0, iv: null, to: null }); }
function bLabel() {
  const b = T().breath;
  if (breath.phase === "in") return breath.count >= 4 ? b.release : b.inhale;
  if (breath.phase === "out") return b.exhale;
  return `${b.round} ${Math.min(breath.round + 1, 3)} ${b.of} 3`;
}
function breathInner(ctx) {
  const b = T().breath, g = T().games;
  if (breath.phase === "done") {
    return `<div class="breath"><div class="bdots">${"<i class=\"on\"></i>".repeat(3)}</div><p class="bdone">${esc(b.done)}</p></div>` +
      (ctx === "screen" ? `<p class="bridge">${esc(b.bridge)}</p><button type="button" class="btn" data-games>${esc(g.toGames)}</button>` : "") +
      `<button type="button" class="btn alt" data-bagain>${esc(b.again)}</button>`;
  }
  const dots = [0, 1, 2].map(n => `<i class="${n < breath.round ? "on" : ""}"></i>`).join("");
  return `<div class="breath"><p class="blabel" data-bl aria-live="polite">${esc(bLabel())}</p>
    <div class="ballwrap"><div class="ball${breath.phase === "in" ? " in" : ""}" data-ball></div><span class="bnum" data-bnum>${breath.phase === "in" ? Math.min(breath.count, 4) : ""}</span></div>
    <div class="bdots" data-bdots>${dots}</div>
    <button type="button" class="hold${breath.phase === "in" ? " on" : ""}" data-hold>${esc(b.hold)}</button></div>`;
}
function bSync() {
  document.querySelectorAll("[data-broot]").forEach(r => {
    if (breath.phase === "done" || !r.querySelector("[data-ball]")) { put(r, breathInner(r.dataset.broot)); return; }
    r.querySelector("[data-bl]").textContent = bLabel();
    r.querySelector("[data-ball]").classList.toggle("in", breath.phase === "in");
    r.querySelector("[data-hold]").classList.toggle("on", breath.phase === "in");
    r.querySelector("[data-bnum]").textContent = breath.phase === "in" ? Math.min(breath.count, 4) : "";
    r.querySelectorAll("[data-bdots] i").forEach((d, n) => d.classList.toggle("on", n < breath.round));
  });
}
function bStart() {
  if (breath.phase === "done" || breath.phase === "in") return;
  clearTimeout(breath.to);
  Object.assign(breath, { phase: "in", count: 1, t0: Date.now() });
  breath.iv = setInterval(() => { breath.count++; bSync(); }, 1000);
  bSync();
}
function bEnd() {
  if (breath.phase !== "in") return;
  clearInterval(breath.iv);
  const full = Date.now() - breath.t0 >= 2500; // короткое нажатие просто не засчитывается — без «ошибки»
  if (full) breath.round++;
  breath.phase = "out"; bSync();
  breath.to = setTimeout(() => {
    breath.phase = breath.round >= 3 ? "done" : "idle"; bSync();
    if (breath.phase === "done" && sheet.classList.contains("open")) {
      const st = document.querySelector("#helpInner .steps"); if (st) st.scrollIntoView({ block: "start", behavior: "smooth" });
    }
  }, full ? 4000 : 1200);
}
function renderBreathScreen() {
  const t = T();
  put(app, vf(
    `<div class="hud"><span class="r"><i></i>${esc(t.games.title)}</span></div>`,
    `<h2>${esc(t.breath.title)}</h2><p class="lead">${esc(t.breath.lead)}</p>
     <div data-broot="screen">${breathInner("screen")}</div>
     <div class="row"><button type="button" class="ghost" data-games>← ${esc(t.games.toGames)}</button></div>`));
}
let sheetBreath = false;

function renderHelp() {
  const s = T().sheet, b = T().breath;
  put(document.getElementById("helpInner"),
    `<h2 id="helpTitle">${esc(s.title)}</h2>
     <div class="breathbox">${sheetBreath
        ? `<p class="lead" style="margin:0 0 4px">${esc(b.lead)}</p><div data-broot="sheet">${breathInner("sheet")}</div>`
        : `<button type="button" class="type wide light" style="margin:0" data-btoggle>${icons.ball}<span><b>${esc(b.title)}</b><small>${esc(b.toggle)}</small></span></button>`}</div>
     <p class="lead">${esc(s.lead)}</p>
     <ol class="steps">${s.steps.map(x => `<li>${esc(x)}</li>`).join("")}</ol>
     ${s.contacts.map(c => `<div class="contact"><span>${esc(c[0])}</span><a href="tel:${esc(c[2])}" aria-label="${esc(s.call)} ${esc(c[1])}: ${esc(c[0])}">${esc(c[1])}</a></div>`).join("")}
     <p class="note">${esc(s.checked)}</p>
     <p class="note">${esc(s.note)}</p>
     <button type="button" class="btn" data-close>${esc(s.close)}</button>`);
}

function render() {
  const t = T();
  document.documentElement.lang = state.lang === "tj" ? "tg" : "ru";
  document.title = t.brand;
  document.getElementById("brand").textContent = t.brand;
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === state.lang)));
  put(document.getElementById("helpBtn"), icons.help + `<span>${esc(t.help)}</span>`);
  put(document.getElementById("foot"), t.footer);
  if (state.screen === "start") renderStart();
  else if (state.screen === "q") renderQuestion();
  else if (state.screen === "games") renderGames();
  else if (state.screen === "find") renderFind();
  else if (state.screen === "breath") renderBreathScreen();
  else renderResult();
  if (sheet.classList.contains("open")) renderHelp();
}

let lastFocus = null;
function openHelp() { lastFocus = document.activeElement; bReset(); sheetBreath = false; if (state.screen === "breath") renderBreathScreen(); renderHelp(); sheet.classList.add("open"); sheet.querySelector(".btn").focus(); }
function closeHelp() { sheet.classList.remove("open"); bReset(); if (state.screen === "breath") renderBreathScreen(); if (lastFocus && lastFocus.isConnected) lastFocus.focus(); }

document.addEventListener("click", e => {
  const el = e.target.closest("button,a,[data-close]");
  if (!el) return;
  if (el.dataset.lang) {
    state.lang = el.dataset.lang;
    try { localStorage.setItem("stopkadr-lang", state.lang); } catch (err) {}
    render(); return;
  }
  if (el.id === "helpBtn") return openHelp();
  if (el.hasAttribute("data-close")) return closeHelp();
  if (el.tagName === "A") return; // tel:-ссылки работают как обычно
  if (el.dataset.spot) {
    if (!find.found.includes(el.dataset.spot)) find.found.push(el.dataset.spot);
    find.last = el.dataset.spot; find.hint = null; updateFind(); return;
  }
  if (el.hasAttribute("data-fhint")) { find.hint = Object.keys(SPOTS).find(id => !find.found.includes(id)) || null; updateFind(); return; }
  if (el.hasAttribute("data-bagain")) { bReset(); bSync(); return; }
  if (el.hasAttribute("data-btoggle")) { sheetBreath = true; renderHelp(); const h = sheet.querySelector("[data-hold]"); if (h) h.focus(); return; }
  if (el.hasAttribute("data-hold")) return;
  if (el.hasAttribute("data-games")) { bReset(); state.screen = "games"; }
  else if (el.dataset.go === "find") { Object.assign(find, { found: [], last: null, hint: null }); state.screen = "find"; }
  else if (el.dataset.go === "breath") { bReset(); state.screen = "breath"; }
  else if (el.hasAttribute("data-freplay")) { Object.assign(find, { found: [], last: null, hint: null }); }
  else if (el.hasAttribute("data-home")) { state.screen = "start"; state.type = null; }
  else if (el.dataset.type) { state.type = el.dataset.type; state.i = 0; state.answers = []; state.screen = "q"; }
  else if (el.dataset.ans) {
    state.answers[state.i] = el.dataset.ans === "1";
    if (state.i < T().types[state.type].qs.length - 1) state.i++; else state.screen = "result";
  }
  else if (el.hasAttribute("data-back")) { if (state.i > 0) state.i--; else state.screen = "start"; }
  else if (el.hasAttribute("data-restart")) { state.screen = "start"; state.type = null; }
  else if (el.hasAttribute("data-redo")) { state.i = 0; state.answers = []; state.screen = "q"; }
  else return;
  render();
  window.scrollTo(0, 0);
  const f = app.querySelector("h1,h2"); if (f) { f.tabIndex = -1; f.focus({ preventScroll: true }); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && sheet.classList.contains("open")) closeHelp();
  if ((e.key === " " || e.key === "Enter") && e.target.closest && e.target.closest("[data-hold]")) { e.preventDefault(); if (!e.repeat) bStart(); }
});
document.addEventListener("keyup", e => { if ((e.key === " " || e.key === "Enter") && e.target.closest && e.target.closest("[data-hold]")) bEnd(); });
/* удержание кнопки «шарика»: pointer-события работают и для пальца, и для мыши */
document.addEventListener("pointerdown", e => {
  const h = e.target.closest("[data-hold]"); if (!h) return;
  e.preventDefault(); try { h.setPointerCapture(e.pointerId); } catch (err) {}
  bStart();
});
["pointerup", "pointercancel"].forEach(ev => document.addEventListener(ev, bEnd));
document.addEventListener("contextmenu", e => { if (e.target.closest("[data-hold]")) e.preventDefault(); });

render();
</script>
