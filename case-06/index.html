<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Safe by Design · аудит игры</title>
<meta name="description" content="Самооценка безопасности игры для детей: 18 вопросов, 6 зон риска, отчёт и рекомендации.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 3 2'%3E%3Crect width='1' height='1' fill='%231F9254'/%3E%3Crect x='1' width='1' height='1' fill='%23E0A100'/%3E%3Crect x='2' width='1' height='1' fill='%23D2322D'/%3E%3Crect y='1' width='3' height='1' fill='%23141B2D'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1F5; --panel:#FFFFFF; --ink:#141B2D; --muted:#56607A; --line:#CBD2DD;
  --cobalt:#2F3FD0; --cobalt-soft:#E3E6FB;
  --safe:#1F9254; --warn:#E0A100; --risk:#D2322D; --empty:#DCE1E9;
  --display:"Unbounded", "IBM Plex Sans", system-ui, sans-serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:10px; --gut:16px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--body)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 var(--gut)}
.mono{font-family:var(--mono);font-size:13px;letter-spacing:.04em;text-transform:uppercase}

/* header */
header.top{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff}
header.top .wrap{display:flex;align-items:center;gap:12px;min-height:56px}
.brand{font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.02em;display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand i{display:grid;grid-template-columns:repeat(3,7px);gap:2px;flex:none}
.brand i b{width:7px;height:7px;border-radius:2px;background:#fff;opacity:.35}
.brand i b:nth-child(1),.brand i b:nth-child(5){background:var(--safe);opacity:1}
.brand i b:nth-child(3){background:var(--warn);opacity:1}
.brand i b:nth-child(6){background:var(--risk);opacity:1}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand em{font-style:normal}
@media (max-width:420px){.brand em{display:none}}
.lang{display:flex;border:1px solid rgba(255,255,255,.35);border-radius:8px;overflow:hidden;flex:none}
.lang button{background:none;border:0;color:#fff;min-width:48px;min-height:44px;font-family:var(--mono);font-weight:600;cursor:pointer}
.lang button[aria-pressed="true"]{background:#fff;color:var(--ink)}
.progress{height:4px;background:rgba(255,255,255,.15)}
.progress div{height:100%;background:var(--warn);transform-origin:left;transform:scaleX(0);transition:transform .35s ease-out}

/* buttons */
.btn{min-height:48px;padding:0 20px;border-radius:var(--r);border:2px solid var(--ink);background:var(--ink);color:#fff;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s ease}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.blue{background:var(--cobalt);border-color:var(--cobalt)}
.row{display:flex;flex-wrap:wrap;gap:10px}

/* screens */
.screen{display:none;padding:28px 0 64px}
.screen.on{display:block;animation:in .3s ease-out both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* intro */
.hero{display:grid;gap:28px;align-items:center}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,6.2vw,50px);line-height:1.08;letter-spacing:-.01em;margin:10px 0 14px}
.hero h1 em{font-style:normal;color:var(--cobalt)}
.lead{font-size:18px;color:var(--muted);max-width:560px;margin:0 0 22px}
.facts{display:flex;flex-wrap:wrap;gap:8px 18px;margin:0 0 24px;padding:0;list-style:none}
.facts li{font-family:var(--mono);font-size:13px;color:var(--muted)}
.facts b{color:var(--ink)}
.field{display:block;margin:0 0 14px}
.field span{display:block;font-weight:600;margin-bottom:6px}
.field small{display:block;color:var(--muted);font-size:14px;margin-top:4px}
.field input,.field textarea{width:100%;min-height:48px;padding:12px 14px;border:2px solid var(--line);border-radius:var(--r);background:var(--panel)}
.field textarea{min-height:84px;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--cobalt);outline:none}
.preview{background:var(--panel);border:2px solid var(--ink);border-radius:14px;padding:18px;box-shadow:8px 8px 0 var(--ink)}
.preview .mono{color:var(--muted)}

/* zone map (signature) */
.map{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.tile{position:relative;overflow:hidden;border-radius:8px;background:var(--empty);min-height:92px;padding:12px;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.tile::before{content:"";position:absolute;inset:0;background:var(--c,transparent);opacity:0;transform:scale(.6);border-radius:inherit}
.tile > *{position:relative}
.tile .t{font-weight:600;font-size:15px;line-height:1.25}
.tile .s{font-family:var(--mono);font-size:12px;letter-spacing:.05em;text-transform:uppercase;opacity:.9}
.tile.green{--c:var(--safe);color:#fff}
.tile.yellow{--c:var(--warn);color:var(--ink)}
.tile.red{--c:var(--risk);color:#fff}
.tile.lit::before{animation:paint .32s ease-out forwards;animation-delay:var(--d,0ms)}
.tile.lit > *{opacity:0;animation:fade .25s ease-out forwards;animation-delay:calc(var(--d,0ms) + 120ms)}
@keyframes paint{to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}

/* quiz */
.qhead h2{font-family:var(--display);font-weight:800;font-size:clamp(22px,4.6vw,34px);margin:6px 0 4px;line-height:1.1}
.qhead p{margin:0 0 6px;color:var(--muted);max-width:640px}
.dots{display:flex;gap:6px;margin:16px 0 22px}
.dots b{flex:1;height:8px;border-radius:3px;background:var(--empty);position:relative;overflow:hidden}
.dots b::after{content:"";position:absolute;inset:0;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .3s ease-out}
.dots b.done::after,.dots b.cur::after{transform:none}
.dots b.cur::after{background:var(--cobalt)}
fieldset{border:0;margin:0 0 22px;padding:0;min-width:0}
legend{font-weight:600;font-size:18px;margin-bottom:10px;padding:0;display:flex;gap:10px}
legend .mono{color:var(--muted);padding-top:3px;flex:none}
.opt{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;min-height:52px;background:var(--panel);border:2px solid var(--line);border-radius:var(--r);margin-bottom:8px;cursor:pointer;transition:transform .15s ease}
.opt:active{transform:scale(.99)}
.opt input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--cobalt);flex:none}
.opt:has(input:checked){border-color:var(--cobalt);background:var(--cobalt-soft)}
.opt.missing{border-color:var(--risk)}
.qnav{display:flex;justify-content:space-between;gap:10px;position:sticky;bottom:0;padding:12px 0;background:linear-gradient(to top,var(--paper) 70%,rgba(238,241,245,0))}
.hint{color:var(--risk);font-weight:600;min-height:24px;margin:0}

/* report */
.rephead{display:grid;gap:22px;align-items:start}
.label{border:3px solid var(--ink);border-radius:14px;background:var(--panel);display:grid;grid-template-columns:auto 1fr;overflow:hidden;box-shadow:8px 8px 0 var(--ink)}
.label .num{background:var(--ink);color:#fff;padding:16px 18px;display:flex;flex-direction:column;justify-content:center;min-width:120px}
.label .num strong{font-family:var(--display);font-weight:800;font-size:52px;line-height:1;font-variant-numeric:tabular-nums}
.label .num span{font-family:var(--mono);font-size:12px;opacity:.75;margin-top:4px}
.label .info{padding:14px 16px}
.label .verdict{font-family:var(--display);font-weight:800;font-size:19px;line-height:1.15;margin:4px 0 6px}
.label .bar{height:10px;background:var(--empty);border-radius:5px;overflow:hidden;margin:10px 0 6px}
.label .bar div{height:100%;background:var(--v,var(--cobalt));transform-origin:left;transform:scaleX(0);transition:transform .4s ease-out}
.label p{margin:0;color:var(--muted);font-size:14px}
.game{font-family:var(--display);font-weight:600;font-size:clamp(20px,4vw,28px);margin:6px 0 4px;word-break:break-word}
.delta{display:inline-block;font-family:var(--mono);font-size:13px;background:var(--cobalt-soft);color:var(--cobalt);padding:4px 8px;border-radius:6px;margin-top:8px}
h3.sec{font-family:var(--display);font-weight:800;font-size:20px;margin:34px 0 12px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px}
.issues{display:grid;gap:12px}
.zcard{background:var(--panel);border-radius:var(--r);border-left:6px solid var(--zc);padding:14px 16px;break-inside:avoid}
.zcard h4{margin:0 0 6px;font-size:17px;display:flex;justify-content:space-between;gap:10px}
.zcard ul{margin:6px 0 0;padding-left:20px}
.zcard li{margin-bottom:6px}
.zcard .ok{margin:0;color:var(--muted)}
.zc-green{--zc:var(--safe)} .zc-yellow{--zc:var(--warn)} .zc-red{--zc:var(--risk)}
.pill{font-family:var(--mono);font-size:12px;font-weight:600;padding:2px 8px;border-radius:5px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;align-self:flex-start}
.pill.green{background:var(--safe);color:#fff}.pill.yellow{background:var(--warn);color:var(--ink)}.pill.red{background:var(--risk);color:#fff}
.actions{margin-top:28px}

/* recs */
.rec{background:var(--panel);border-radius:var(--r);border-left:6px solid var(--zc);padding:16px;margin-bottom:12px;break-inside:avoid}
.rec h4{margin:0 0 10px;display:flex;gap:10px;align-items:center;font-size:18px;flex-wrap:wrap}
.rec ol{margin:0;padding-left:22px}
.rec li{margin-bottom:10px}
.rec li b{display:block}
.rec li span{color:var(--muted)}
.allgreen{background:var(--panel);border-radius:var(--r);padding:18px;border-left:6px solid var(--safe)}
.ai{margin-top:28px;border:2px dashed var(--cobalt);border-radius:14px;padding:18px;background:var(--panel)}
.ai h4{margin:0 0 6px;font-family:var(--display);font-size:17px}
.ai p{margin:0 0 12px;color:var(--muted)}
.ai pre{white-space:pre-wrap;word-break:break-word;font:13px/1.45 var(--mono);background:var(--paper);padding:12px;border-radius:8px;max-height:260px;overflow:auto;margin:12px 0 0}
.printonly{display:none}

/* entry card on start screen */
.playcard{display:grid;grid-template-columns:1fr auto;gap:2px 14px;align-items:center;width:100%;margin-top:18px;padding:14px 16px;text-align:left;background:var(--panel);border:2px solid var(--ink);border-left:8px solid var(--cobalt);border-radius:var(--r);cursor:pointer;transition:transform .15s ease}
.playcard:active{transform:scale(.98)}
.playcard .mono{color:var(--cobalt);grid-column:1}
.playcard b{font-family:var(--display);font-weight:800;font-size:17px;grid-column:1}
.playcard span:not(.mono){color:var(--muted);font-size:15px;grid-column:1}
.playcard i{grid-column:2;grid-row:1/4;font-style:normal;font-family:var(--display);font-size:24px;color:var(--cobalt)}

/* mini-game */
.gwrap{display:grid;gap:22px;align-items:start}
.ghead h2{font-family:var(--display);font-weight:800;font-size:clamp(22px,4.6vw,34px);margin:6px 0 6px;line-height:1.1}
.ghead p{margin:0 0 12px;color:var(--muted);max-width:620px}
.gcount{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{font-family:var(--mono);font-size:13px;font-weight:600;padding:6px 10px;border-radius:6px;background:var(--panel);border:2px solid var(--ink)}
.chip.goodchip{border-color:var(--safe);color:var(--safe)}
.chip.goodchip.off{border-color:var(--line);color:var(--muted)}
.phone{width:100%;max-width:360px;margin:0 auto;background:var(--ink);border-radius:32px;padding:10px}
.kscreen{border-radius:24px;padding:12px;display:grid;gap:10px;color:#fff;background:linear-gradient(165deg,#6E56F8 0%,#B04BDF 55%,#FF7A9E 100%)}
.kbar{display:flex;justify-content:space-between;align-items:center;padding:2px 4px}
.kbar b{font-family:var(--display);font-weight:800;font-size:16px}
.kcoins{font-family:var(--mono);font-weight:600;font-size:13px;background:rgba(0,0,0,.25);padding:4px 10px;border-radius:20px}
.kcoins::before{content:"";display:inline-block;width:10px;height:10px;background:#7FF0FF;transform:rotate(45deg);margin-right:6px}
.spot{position:relative;display:block;width:100%;text-align:left;border:0;border-radius:14px;padding:10px 12px;cursor:pointer;font-size:14px;line-height:1.35;color:#fff;background:rgba(255,255,255,.18);transition:transform .15s ease}
.spot:hover{outline:2px dashed rgba(255,255,255,.85);outline-offset:2px}
.spot:active{transform:scale(.97)}
.spot.active{outline:3px solid #fff;outline-offset:2px}
.spot.found::after{content:"!";position:absolute;top:-9px;right:-7px;width:26px;height:26px;border-radius:50%;background:var(--risk);color:#fff;font:700 15px/26px var(--body);text-align:center;border:2px solid #fff;animation:pop .3s ease-out}
.spot.good.found::after{content:"✓";background:var(--safe)}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:none;opacity:1}}
.s-age{background:rgba(20,27,45,.55);display:flex;justify-content:space-between;align-items:center;gap:10px}
.s-age em{font-style:normal;background:#fff;color:var(--ink);font-weight:700;padding:6px 10px;border-radius:10px;white-space:nowrap}
.s-offer{background:#FFD84D;color:var(--ink)}
.s-offer strong{display:block;font-family:var(--display);font-size:15px}
.s-offer .tmr{display:inline-block;margin-top:6px;font:600 20px var(--mono);background:var(--risk);color:#fff;padding:2px 10px;border-radius:8px;font-variant-numeric:tabular-nums}
.kpet{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center}
.pet{width:96px;height:84px;border-radius:48px 48px 38px 38px;background:#FFB0D0;position:relative}
.pet::before,.pet::after{content:"";position:absolute;top:30px;width:12px;height:14px;border-radius:50%;background:var(--ink)}
.pet::before{left:26px}.pet::after{right:26px}
.pet i{position:absolute;left:36px;top:56px;width:24px;height:12px;border:3px solid var(--ink);border-bottom:0;border-radius:14px 14px 0 0}
.s-streak{background:#fff;color:var(--ink);border-radius:14px 14px 14px 2px}
.s-loot{background:#FF3D7F;display:flex;gap:12px;align-items:center;font-weight:600}
.egg{flex:none;width:34px;height:42px;border-radius:50% 50% 46% 46%/60% 60% 40% 40%;background:repeating-linear-gradient(135deg,#FFE680 0 6px,#FFC94D 6px 12px)}
.s-loot small{display:block;font-weight:400;opacity:.9}
.s-chat{background:#fff;color:var(--ink);border-radius:14px 14px 14px 2px}
.s-chat b{color:#6E56F8;font-family:var(--mono);font-size:12px;display:block}
.s-geo{background:rgba(20,27,45,.55);display:flex;gap:10px;align-items:center}
.s-geo .box{flex:none;width:22px;height:22px;border-radius:5px;background:var(--safe);color:#fff;font-weight:700;text-align:center;line-height:22px}
.s-break{background:#DFF5E8;color:var(--ink);display:flex;gap:12px;align-items:center}
.breath{flex:none;width:28px;height:28px;border-radius:50%;background:var(--safe);opacity:.8;animation:breathe 4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.7)}50%{transform:scale(1)}}
.gpanel{background:var(--panel);border:2px solid var(--ink);border-radius:14px;padding:18px;box-shadow:8px 8px 0 var(--ink)}
.gpanel .gp-in{animation:in .25s ease-out both}
.gpanel h3{font-family:var(--display);font-weight:800;font-size:19px;margin:8px 0 12px;line-height:1.2}
.gpanel h5{font-family:var(--mono);font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px}
.gpanel blockquote{margin:0;font-size:17px;font-style:italic;border-left:4px solid var(--warn);padding-left:12px}
.gpanel p{margin:0}
.gpanel .empty{color:var(--muted)}
.gpanel .pill.blue{background:var(--cobalt);color:#fff}
.gclose{display:none}
.gdone{margin-top:16px;padding:14px;border-radius:var(--r);background:var(--cobalt-soft)}
.gdone p{margin:0 0 10px;font-weight:600}
@media (max-width:759px){
  .gpanel{position:fixed;left:8px;right:8px;bottom:8px;z-index:10;max-height:66vh;overflow:auto;transform:translateY(calc(100% + 24px));opacity:0;transition:transform .3s ease-out,opacity .2s;box-shadow:0 -6px 0 var(--ink)}
  .gpanel.open{transform:none;opacity:1}
  .gclose{display:flex;width:100%;margin-top:14px}
}
@media (min-width:760px){
  .gwrap{grid-template-columns:minmax(0,360px) 1fr;gap:40px}
  .gpanel{position:sticky;top:84px}
}
footer.foot{color:var(--muted);font-size:14px;padding:0 var(--gut) 32px}

@media (min-width:760px){
  .hero{grid-template-columns:1.25fr 1fr;gap:48px}
  .map{grid-template-columns:repeat(3,1fr)}
  .rephead{grid-template-columns:1fr 1.1fr}
  .issues{grid-template-columns:1fr 1fr}
  .screen{padding-top:44px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .tile.lit::before{opacity:1;transform:none}
  .tile.lit > *{opacity:1}
}
@media print{
  @page{margin:12mm}
  *,*::before,*::after{animation:none!important;transition:none!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff;font-size:10.5pt;line-height:1.4}
  header.top,.qnav,.actions,.ai,.noprint,footer.foot{display:none!important}
  .screen{display:none!important;padding:0}
  #s-report,#s-recs{display:block!important}
  #s-recs{break-before:page}
  .printonly{display:block;margin-bottom:4mm}
  .tile.lit::before{opacity:1;transform:none}
  .tile.lit > *{opacity:1}
  .tile{min-height:52px;padding:8px}
  .label,.preview{box-shadow:none}
  .label .bar div{transform:scaleX(var(--p,0))!important}
  .zcard,.rec{border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 12px}
  .map,.issues{gap:6px}
  .map{grid-template-columns:repeat(3,1fr)}
  .rephead{grid-template-columns:1fr 1.1fr}
  .issues{grid-template-columns:1fr 1fr}
  h3.sec{margin:12px 0 6px;font-size:14pt}
  body{font-size:9.5pt;line-height:1.3}
  #recs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .rec{margin:0;padding:8px 10px}
  .rec h4{font-size:11pt;margin-bottom:4px}
  .rec li,.zcard li{margin-bottom:3px}
  .zcard h4{font-size:11pt}
  .label .num strong{font-size:40px}
  .label .num,.label .info{padding:10px 12px}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><i aria-hidden="true"><b></b><b></b><b></b><b></b><b></b><b></b></i><span>Safe by Design<em data-t="brandSub"></em></span></div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="ru">RU</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </div>
  <div class="progress" aria-hidden="true"><div id="pbar"></div></div>
</header>

<main class="wrap">
  <!-- Screen 0: intro -->
  <section class="screen on" id="s-intro" aria-labelledby="h-intro">
    <div class="hero">
      <div>
        <div class="mono" data-t="eyebrow"></div>
        <h1 id="h-intro" data-t="heroTitle"></h1>
        <p class="lead" data-t="heroLead"></p>
        <ul class="facts" id="facts"></ul>
        <label class="field"><span data-t="gameName"></span>
          <input id="gname" maxlength="60" autocomplete="off">
        </label>
        <label class="field"><span data-t="gameDesc"></span>
          <textarea id="gdesc" maxlength="400"></textarea>
          <small data-t="gameDescHint"></small>
        </label>
        <div class="row">
          <button class="btn blue" id="start" type="button" data-t="start"></button>
          <button class="btn ghost" id="demo" type="button" data-t="demo"></button>
        </div>
        <button class="playcard" id="playBtn" type="button">

/* ============ RUBRIC: pure and deterministic (same answers -> same score) ============ */
function zoneLevel(points, th) {
  if (points >= th.red) return "red";
  if (points >= th.yellow) return "yellow";
  return "green";
}
function evaluate(answers) {
  let total = 0, max = 0;
  const zones = content.zones.map(z => {
    let pts = 0, zmax = 0;
    const issues = [];
    z.questions.forEach(q => {
      const opt = q.options[answers[q.id]];
      const s = opt ? opt.score : 0;
      pts += s;
      zmax += Math.max(...q.options.map(o => o.score));
      if (s > 0) issues.push(q);
    });
    total += pts; max += zmax;
    return { zone: z, points: pts, max: zmax, level: zoneLevel(pts, z.thresholds), issues };
  });
  const score = Math.round(100 * (1 - total / max));
  const reds = zones.filter(z => z.level === "red").length;
  const band = score >= 80 && reds === 0 ? "low" : score >= 50 ? "mid" : "high";
  return { score, band, reds, zones };
}

   The function keeps the API key in a server environment variable, accepts ONLY
   { lang, game, answers, rubric }, stores nothing and returns personal steps.
   The rubric above still sets the score; AI only adds wording.
   This prototype makes NO network calls and contains NO key. */
function buildAiPayload() {
  return {
    lang: state.lang,
    game: { title: state.game.name || null, description: state.game.desc || null },
    answers: state.answers,
    rubric: state.result.zones.map(z => ({ zone: z.zone.id, level: z.level, points: z.points }))
  };
}
async function requestAiRecommendations(payload) {
  // When the server function exists:
  // const r = await fetch("/api/recommend", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
  // return r.json();
  return { stub: true, payload };
}

/* ============ STATE + RENDER ============ */
const $ = s => document.querySelector(s);
// Only trusted template strings built from `content` go through here; user input always uses textContent.
const setHTML = (el, s) => el.replaceChildren(document.createRange().createContextualFragment(s));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const state = {
  lang: store.get("sbd-lang") === "en" ? "en" : "ru",
  screen: "intro", zone: 0, answers: {}, game: { name: "", desc: "" },
  result: null, prevScore: null, aiShown: false
};
const T = () => content.ui[state.lang];
const L = o => o[state.lang];
const totalQ = content.zones.reduce((n, z) => n + z.questions.length, 0);

function show(id) {
  state.screen = id;
  if (id !== "game") { stopTimer(); $("#gPanel").classList.remove("open"); }
  document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === "s-" + id));
  window.scrollTo(0, 0);
  updateProgress();
}
function updateProgress() {
  const n = Object.keys(state.answers).length;
  const p = state.screen === "intro" ? 0 : state.screen === "quiz" ? n / totalQ
    : state.screen === "game" ? darkFound() / darkTotal : 1;
  $("#pbar").style.transform = `scaleX(${p})`;
}

function renderStatic() {
  const t = T();
  document.documentElement.lang = state.lang;
  document.title = t.brand;
  document.querySelectorAll("[data-t]").forEach(el => setHTML(el, t[el.dataset.t]));
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === state.lang));
  const g = L(content.minigame.ui);
  $("#pcEyebrow").textContent = g.cardEyebrow; $("#pcTitle").textContent = g.cardTitle; $("#pcText").textContent = g.cardText;
  setHTML($("#facts"), t.facts.map(f => `<li>${f}</li>`).join(""));
  const sample = ["red", "red", "yellow", "yellow", "green", "green"];
  setHTML($("#introMap"), content.zones.map((z, i) =>
    `<div class="tile ${sample[i]} lit" style="--d:${i * 70}ms"><span class="t">${L(z.title)}</span><span class="s">${t.levels[sample[i]]}</span></div>`).join(""));
}

function renderQuiz() {
  const t = T(), z = content.zones[state.zone], n = content.zones.length;
  $("#zoneCount").textContent = t.zoneOf(state.zone + 1, n);
  $("#h-zone").textContent = L(z.title);
  $("#zoneBlurb").textContent = L(z.blurb);
  setHTML($("#dots"), content.zones.map((_, i) => `<b class="${i < state.zone ? "done" : i === state.zone ? "cur" : ""}"></b>`).join(""));
  let qn = content.zones.slice(0, state.zone).reduce((a, zz) => a + zz.questions.length, 0);
  setHTML($("#qform"), z.questions.map(q => {
    qn++;
    return `<fieldset data-q="${q.id}"><legend><span class="mono">${String(qn).padStart(2, "0")}/${totalQ}</span><span>${L(q.text)}</span></legend>` +
      q.options.map((o, i) => `<label class="opt"><input type="radio" name="${q.id}" value="${i}" ${state.answers[q.id] === i ? "checked" : ""}><span>${L(o.label)}</span></label>`).join("") +
      `</fieldset>`;
  }).join(""));
  $("#hint").textContent = "";
  $("#back").textContent = t.back;
  $("#next").textContent = state.zone === n - 1 ? t.finish : t.next;
}

function animateScore(target) {
  const el = $("#score");
  if (reduced) { el.textContent = target; return; }
  const t0 = performance.now(), dur = 400;
  const step = now => {
    const k = Math.min(1, (now - t0) / dur);
    el.textContent = Math.round(target * (1 - Math.pow(1 - k, 3)));
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function renderReport(animate) {
  const t = T(), r = state.result;
  $("#h-report").textContent = state.game.name || t.untitled;
  $("#repDate").textContent = new Date().toLocaleDateString(state.lang === "ru" ? "ru-RU" : "en-GB", { day: "numeric", month: "long", year: "numeric" });
  const delta = $("#delta");
  delta.replaceChildren();
  if (state.prevScore !== null && state.prevScore !== r.score) {
    const s = document.createElement("span"); s.className = "delta"; s.textContent = t.deltaText(state.prevScore, r.score); delta.append(s);
  }
  $("#verdict").textContent = t.verdicts[r.band];
  $("#verdictNote").textContent = (r.reds ? t.redCount(r.reds) : "") + t.verdictNotes[r.band];
  const bar = $("#sbar");
  bar.style.setProperty("--v", { low: "var(--safe)", mid: "var(--warn)", high: "var(--risk)" }[r.band]);
  bar.style.setProperty("--p", r.score / 100);
  if (animate) {
    bar.style.transform = "scaleX(0)";
    requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.transform = `scaleX(${r.score / 100})`; }));
    animateScore(r.score);
  } else {
    bar.style.transform = `scaleX(${r.score / 100})`;
    $("#score").textContent = r.score;
  }
  setHTML($("#repMap"), r.zones.map((z, i) =>
    `<div class="tile ${z.level} lit" style="--d:${animate ? i * 140 : 0}ms"><span class="t">${L(z.zone.title)}</span><span class="s">${t.levels[z.level]} · ${t.riskPts(z.points, z.max)}</span></div>`).join(""));
  setHTML($("#legend"), ["safe", "warn", "risk"].map((c, i) => `<span><i style="background:var(--${c})"></i>${t.legend[i]}</span>`).join(""));
  setHTML($("#issues"), r.zones.map(z =>
    `<article class="zcard zc-${z.level}"><h4><span>${L(z.zone.title)}</span><span class="pill ${z.level}">${t.levels[z.level]}</span></h4>` +
    (z.issues.length ? `<ul>${z.issues.map(q => `<li>${L(q.issue)}</li>`).join("")}</ul>` : `<p class="ok">${t.noIssues}</p>`) +
    `</article>`).join(""));
}

function renderRecs() {
  const t = T(), r = state.result;
  const bad = r.zones.filter(z => z.level !== "green")
    .sort((a, b) => (b.level === "red") - (a.level === "red") || b.points - a.points);
  if (!bad.length) { setHTML($("#recs"), `<div class="allgreen">${t.allGreen}</div>`); }
  else setHTML($("#recs"), bad.map(z => {
    const items = z.zone.recommendations.filter(x => z.level === "red" || x.level === "yellow");
    return `<article class="rec zc-${z.level}"><h4><span class="pill ${z.level}">${t.levels[z.level]}</span>${L(z.zone.title)}</h4><ol>` +
      items.map(x => `<li><b>${L(x.t)}</b><span>${L(x.d)}</span></li>`).join("") + `</ol></article>`;
  }).join(""));
  if (state.aiShown) showAi(); else $("#aiOut").hidden = true;
}

async function showAi() {
  state.aiShown = true;
  const res = await requestAiRecommendations(buildAiPayload());
  const pre = $("#aiOut");
  pre.textContent = T().aiStub + "\n\nPOST /api/recommend\n" + JSON.stringify(res.payload, null, 2);
  pre.hidden = false;
}

/* ============ MINI-GAME: find the dark pattern (in memory only, no losing) ============ */
const MG = content.minigame;
const mg = { found: new Set(), active: null, sec: 59, iv: null, open: false };
const darkTotal = MG.spots.filter(s => !s.good).length;
const darkFound = () => MG.spots.filter(s => !s.good && mg.found.has(s.id)).length;
const fmtTimer = s => `0:${String(s).padStart(2, "0")}`;

function renderMock() {
  const m = L(MG.mock);
  setHTML($("#kscreen"), `
    <div class="kbar"><b>${m.game}</b><span class="kcoins">${m.coins}</span></div>
    <button type="button" class="spot s-age" data-spot="age"><span>${m.age}</span><em>${m.ageBtn}</em></button>
    <button type="button" class="spot s-offer" data-spot="offer"><strong>${m.offerTitle}</strong>${m.offerLeft} <span class="tmr">${fmtTimer(mg.sec)}</span></button>
    <div class="kpet"><div class="pet" aria-hidden="true"><i></i></div>
      <button type="button" class="spot s-streak" data-spot="streak">${m.streak}</button></div>
    <button type="button" class="spot s-loot" data-spot="loot"><span class="egg" aria-hidden="true"></span><span>${m.lootTitle}<small>${m.lootSub}</small></span></button>
    <button type="button" class="spot s-chat" data-spot="chat"><b>${m.chatName}</b>${m.chatText}</button>
    <button type="button" class="spot s-geo" data-spot="geo"><span class="box" aria-hidden="true">✓</span><span>${m.geo}</span></button>
    <button type="button" class="spot s-break good" data-spot="break"><span class="breath" aria-hidden="true"></span><span>${m.breakText}</span></button>`);
}

function renderGameState() {
  const g = L(MG.ui);
  document.querySelectorAll("#kscreen .spot").forEach(b => {
    b.classList.toggle("found", mg.found.has(b.dataset.spot));
    b.classList.toggle("active", mg.active === b.dataset.spot);
    b.setAttribute("aria-pressed", mg.found.has(b.dataset.spot));
  });
  $("#gFound").textContent = g.found(darkFound(), darkTotal);
  const goodChip = $("#gGood");
  goodChip.textContent = mg.found.has("break") ? g.goodOn : g.goodOff;
  goodChip.classList.toggle("off", !mg.found.has("break"));

  const done = darkFound() === darkTotal;
  const doneHTML = `<p>${g.done(darkFound(), darkTotal)}</p><button class="btn blue" type="button" data-act="audit">${g.toAudit}</button>`;
  const gd = $("#gDone");
  gd.hidden = !done;
  if (done) setHTML(gd, doneHTML);

  const panel = $("#gPanel");
  const s = MG.spots.find(x => x.id === mg.active);
  if (!s) setHTML(panel, `<p class="empty">${g.empty}</p>`);
  else {
    const zone = content.zones.find(z => z.id === s.zone);
    setHTML(panel, `<div class="gp-in">
      <span class="pill ${s.good ? "green" : "red"}">${s.good ? g.good : g.dark}</span>
      <h3>${L(s.title)}</h3>
      <h5>${g.feel}</h5><blockquote>${L(s.feel)}</blockquote>
      <h5>${s.good ? g.why : g.fix}</h5><p>${L(s.fix)}</p>
      <h5>${g.zone}</h5><span class="pill blue">${L(zone.title)}</span>
      ${done ? `<div class="gdone">${doneHTML}</div>` : ""}
      <button class="btn ghost gclose" type="button" data-act="close">${g.close}</button></div>`);
  }
  panel.classList.toggle("open", mg.open && !!s);
  updateProgress();
}

function renderGame() {
  const g = L(MG.ui);
  $("#gEyebrow").textContent = g.eyebrow;
  $("#h-game").textContent = g.title;
  $("#gIntro").textContent = g.intro;
  $("#gBack").textContent = g.back;
  renderMock();
  renderGameState();
}

function startTimer() {
  stopTimer();
  mg.iv = setInterval(() => {
    mg.sec = mg.sec <= 0 ? 59 : mg.sec - 1;  // loops forever: the "deal" never really ends
    const t = $("#kscreen .tmr");
    if (t) t.textContent = fmtTimer(mg.sec);
  }, 1000);
}
function stopTimer() { if (mg.iv) { clearInterval(mg.iv); mg.iv = null; } }

function openAudit() {
  stopTimer();
  state.game = { name: $("#gname").value.trim(), desc: $("#gdesc").value.trim() };
  state.zone = 0; renderQuiz(); show("quiz");
}

function renderAll() {
  renderStatic();
  if (state.screen === "game") renderGame();
  if (state.screen === "quiz") renderQuiz();
  if (state.result) { renderReport(false); renderRecs(); }
}

/* ============ EVENTS ============ */
document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => {
  state.lang = b.dataset.lang; store.set("sbd-lang", state.lang); renderAll();
}));
$("#start").addEventListener("click", () => {
  state.game = { name: $("#gname").value.trim(), desc: $("#gdesc").value.trim() };
  state.zone = 0; renderQuiz(); show("quiz");
});
$("#demo").addEventListener("click", () => {
  const d = content.demo;
  $("#gname").value = d.name; $("#gdesc").value = L(d.desc);
  state.game = { name: d.name, desc: L(d.desc) };
  state.answers = { ...d.answers };
  state.zone = 0; renderQuiz(); show("quiz");
});
$("#qform").addEventListener("change", e => {
  if (e.target.type !== "radio") return;
  state.answers[e.target.name] = Number(e.target.value);
  e.target.closest("fieldset").querySelectorAll(".opt").forEach(o => o.classList.remove("missing"));
  $("#hint").textContent = "";
  updateProgress();
});
$("#back").addEventListener("click", () => {
  if (state.zone === 0) { show("intro"); return; }
  state.zone--; renderQuiz(); window.scrollTo(0, 0);
});
$("#next").addEventListener("click", () => {
  const z = content.zones[state.zone];
  const missing = z.questions.filter(q => state.answers[q.id] === undefined);
  if (missing.length) {
    $("#hint").textContent = T().missing(missing.length);
    missing.forEach(q => document.querySelectorAll(`[data-q="${q.id}"] .opt`).forEach(o => o.classList.add("missing")));
    document.querySelector(`[data-q="${missing[0].id}"]`).scrollIntoView({ block: "center", behavior: reduced ? "auto" : "smooth" });
    return;
  }
  if (state.zone < content.zones.length - 1) { state.zone++; renderQuiz(); window.scrollTo(0, 0); return; }
  state.result = evaluate(state.answers);
  show("report"); renderReport(true); renderRecs();
});
$("#toRecs").addEventListener("click", () => show("recs"));
$("#toReport").addEventListener("click", () => { show("report"); renderReport(true); });
$("#edit").addEventListener("click", () => { state.prevScore = state.result.score; state.zone = 0; renderQuiz(); show("quiz"); });
$("#restart").addEventListener("click", () => {
  Object.assign(state, { answers: {}, result: null, prevScore: null, aiShown: false, zone: 0, game: { name: "", desc: "" } });
  $("#gname").value = ""; $("#gdesc").value = ""; $("#aiOut").hidden = true; show("intro");
});
$("#aiBtn").addEventListener("click", showAi);
$("#playBtn").addEventListener("click", () => {
  mg.found.clear(); mg.active = null; mg.open = false; mg.sec = 59;
  show("game"); renderGame(); startTimer();
});
$("#kscreen").addEventListener("click", e => {
  const b = e.target.closest(".spot");
  if (!b) return;
  mg.found.add(b.dataset.spot); mg.active = b.dataset.spot; mg.open = true;
  renderGameState();
});
$("#s-game").addEventListener("click", e => {
  const a = e.target.closest("[data-act]");
  if (!a) return;
  if (a.dataset.act === "close") { mg.open = false; $("#gPanel").classList.remove("open"); }
  if (a.dataset.act === "audit") openAudit();
});
$("#gBack").addEventListener("click", () => show("intro"));
$("#print1").addEventListener("click", () => window.print());
$("#print2").addEventListener("click", () => window.print());

renderStatic();
updateProgress();
</script>
</body>
</html>
