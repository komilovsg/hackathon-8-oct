<!doctype html>
<html lang="tg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#18584A">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 28 28%22%3E%3Crect width=%2228%22 height=%2228%22 rx=%226%22 fill=%22%2318584A%22/%3E%3Cpath d=%22M5 8a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3h-6l-4 4v-4a3 3 0 0 1-3-3z%22 fill=%22%23E2B33C%22/%3E%3C/svg%3E">
<title>Гуфтугӯ дар хона</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700;800&family=Noto+Serif:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#EEF3EE;      /* шир — pale green-milk */
  --card:#FFFFFF;
  --ink:#13231F;
  --ink-soft:#4A5C57;
  --choi:#18584A;        /* tea-pot green, primary */
  --choi-deep:#0F3F35;
  --anor:#C23B4A;        /* pomegranate, "don't" */
  --zar:#E2B33C;         /* gold */
  --line:#D5E0DA;
  --ok:#1E7A55;
  --sans:"Noto Sans", Roboto, "Segoe UI", Arial, sans-serif;
  --serif:"Noto Serif", Georgia, "Times New Roman", serif;
  --r:20px;
  --nav-h:76px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--ground);color:var(--ink);font-family:var(--sans);
  font-size:18px;line-height:1.45;-webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:3px solid var(--zar);outline-offset:3px}

/* ---------- ikat (atlas) band: the signature ---------- */
.ikat{
  height:14px;
  background:
    linear-gradient(135deg,var(--choi) 25%,transparent 25%) 0 0/28px 14px,
    linear-gradient(225deg,var(--choi) 25%,transparent 25%) 0 0/28px 14px,
    linear-gradient(315deg,var(--anor) 25%,transparent 25%) 14px 0/28px 14px,
    linear-gradient(45deg,var(--anor) 25%,transparent 25%) 14px 0/28px 14px,
    var(--zar);
}
.ikat.thin{height:8px;
  background:
    linear-gradient(135deg,var(--choi) 25%,transparent 25%) 0 0/16px 8px,
    linear-gradient(225deg,var(--choi) 25%,transparent 25%) 0 0/16px 8px,
    linear-gradient(315deg,var(--anor) 25%,transparent 25%) 8px 0/16px 8px,
    linear-gradient(45deg,var(--anor) 25%,transparent 25%) 8px 0/16px 8px,
    var(--zar);}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:20;background:var(--choi);color:#fff}
.bar{display:flex;align-items:center;gap:8px;padding:8px 16px;min-height:62px;max-width:560px;margin:0 auto}
.brand{flex:1;min-width:0;font-weight:800;font-size:18px;line-height:1.15;display:flex;align-items:center;gap:8px}
.brand svg{flex:none}
.lang-btn{
  min-height:48px;padding:0 14px;border-radius:999px;background:#fff;color:var(--choi-deep);
  font-weight:700;font-size:16px;display:flex;align-items:center;gap:6px;flex:none;
}
.age-chip{
  min-height:48px;padding:0 12px;border-radius:999px;border:2px solid rgba(255,255,255,.55);
  color:#fff;font-weight:700;font-size:15px;flex:none;white-space:nowrap;
}
.age-chip[hidden]{display:none}
@media (max-width:419px){ .bar.compact .brand span{display:none} }

main{max-width:560px;margin:0 auto;padding:0 0 calc(var(--nav-h) + 24px)}
.screen{display:none}
.screen.on{display:block;animation:fadeIn .32s ease-out both}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- start ---------- */
.start{padding:28px 16px 24px}
.start h1{font-family:var(--serif);font-size:30px;line-height:1.2;font-weight:700;color:var(--choi-deep);margin-bottom:22px}
.ages{display:grid;gap:14px}
.age{
  display:flex;align-items:center;gap:16px;width:100%;min-height:96px;padding:12px 20px;
  background:var(--card);border-radius:var(--r);border:2px solid var(--line);text-align:left;
  box-shadow:0 2px 0 var(--line);transition:transform .15s ease-out;
}
.age:active{transform:scale(.97)}
.age .fig{width:64px;height:72px;flex:none;display:flex;align-items:flex-end;justify-content:center}
.age b{font-size:30px;font-weight:800;color:var(--choi-deep);line-height:1}
.age span span{display:block;font-size:17px;color:var(--ink-soft);margin-top:4px}
.age .go{margin-left:auto;width:44px;height:44px;border-radius:50%;background:var(--choi);display:grid;place-items:center;flex:none}
.privacy{margin-top:22px;display:flex;gap:10px;align-items:flex-start;color:var(--ink-soft);font-size:16px}
.privacy svg{flex:none}

/* ---------- section head ---------- */
.shead{padding:20px 16px 10px}
.shead h2{font-family:var(--serif);font-size:25px;line-height:1.2;color:var(--choi-deep)}

/* ---------- swipe deck ---------- */
.deck{
  display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;
  padding:6px 24px 14px;scroll-padding:0 24px;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;overscroll-behavior-x:contain;
}
.deck::-webkit-scrollbar{display:none}
.card{
  flex:0 0 calc(100% - 48px);scroll-snap-align:center;scroll-snap-stop:always;
  background:var(--card);border-radius:var(--r);overflow:hidden;
  box-shadow:0 1px 0 var(--line),0 8px 24px -14px rgba(19,35,31,.35);
  display:flex;flex-direction:column;
}
.card-body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:14px;flex:1}
.say{font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--choi)}
.phrase{font-family:var(--serif);font-size:25px;line-height:1.32;font-weight:600;color:var(--ink)}
.phrase::before{content:"«";color:var(--zar)}
.phrase::after{content:"»";color:var(--zar)}
.tip{display:flex;gap:10px;align-items:flex-start;background:#F4F7F2;border-radius:14px;padding:12px 14px;font-size:17px;color:var(--ink-soft)}
.tip svg{flex:none;margin-top:2px}
.actions{display:flex;gap:10px;align-items:center;margin-top:auto}
.listen{
  position:relative;flex:1;width:100%;min-height:60px;border-radius:999px;background:var(--choi);color:#fff;
  font-weight:800;font-size:19px;display:flex;align-items:center;justify-content:center;gap:10px;
  transition:transform .15s ease-out;
}
.listen:active{transform:scale(.97)}
.listen::after{
  content:"";position:absolute;inset:-5px;border-radius:inherit;border:3px solid var(--zar);
  opacity:0;pointer-events:none;
}
.listen.playing{background:var(--choi-deep)}
.listen.playing::after{animation:pulse .4s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.35;transform:scale(.98)}to{opacity:1;transform:scale(1.04)}}
.share{width:60px;height:60px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}

.pager{display:flex;align-items:center;justify-content:space-between;padding:0 16px;gap:8px}
.arrow{width:52px;height:52px;border-radius:50%;background:var(--card);border:2px solid var(--line);display:grid;place-items:center;transition:opacity .2s}
.arrow[disabled]{opacity:.35;cursor:default}
.dots{display:flex;gap:8px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);transition:transform .2s ease-out,background-color .2s}
.dot.on{background:var(--choi);transform:scale(1.35)}
.count{font-size:15px;color:var(--ink-soft);font-weight:600;min-width:44px;text-align:center}

/* ---------- told: do / don't ---------- */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:4px 16px 10px}
.seg button{
  min-height:64px;border-radius:16px;border:2px solid var(--line);background:var(--card);
  font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px;line-height:1.15;padding:6px 10px;
}
.seg button.on.do{background:var(--ok);border-color:var(--ok);color:#fff}
.seg button.on.dont{background:var(--anor);border-color:var(--anor);color:#fff}
.mark{width:52px;height:52px;border-radius:50%;display:grid;place-items:center}
.mark.do{background:#E3F1EA}
.mark.dont{background:#F8E3E5}
.card.dont .listen{background:var(--anor)}
.card.dont .listen.playing{background:#8E2632}
.card.do{border-top:6px solid var(--ok)}
.card.dont{border-top:6px solid var(--anor)}
.told-text{font-size:23px;line-height:1.35;font-weight:700}

/* ---------- glossary ---------- */
.gloss{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:6px 16px}
.term{
  min-height:120px;background:var(--card);border-radius:var(--r);border:2px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px 8px;
  font-weight:700;font-size:17px;text-align:center;line-height:1.2;transition:transform .15s ease-out;
}
.term:active{transform:scale(.96)}
.term .ico{font-size:40px;line-height:1}

.sheet-bg{position:fixed;inset:0;background:rgba(15,35,30,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;overflow:hidden;
  background:var(--card);border-radius:24px 24px 0 0;transform:translateY(105%);visibility:hidden;
  transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s .32s;padding-bottom:max(18px,env(safe-area-inset-bottom));
}
.sheet.on{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet .inner{padding:18px 20px 8px;display:flex;flex-direction:column;gap:14px}
.sheet .big{font-size:64px;line-height:1;text-align:center}
.sheet h3{font-family:var(--serif);font-size:27px;text-align:center;color:var(--choi-deep)}
.sheet p{font-size:20px;line-height:1.4}
.close{position:absolute;top:22px;right:12px;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#F1F4F2}

/* ---------- help ---------- */
.contacts{display:grid;gap:12px;padding:6px 16px}
.contact{background:var(--card);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:10px;border:2px solid var(--line)}
.contact b{font-size:19px}
.contact .num{font-size:22px;font-weight:800;color:var(--choi-deep);letter-spacing:.02em}
.call{
  min-height:56px;border-radius:999px;background:var(--choi);color:#fff;font-weight:800;font-size:18px;
  display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;
}
.note{padding:14px 16px;font-size:15px;color:var(--ink-soft)}

/* ---------- bottom nav ---------- */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
}
nav .row{display:grid;grid-template-columns:repeat(5,1fr);max-width:560px;margin:0 auto;height:var(--nav-h)}
nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:700;color:var(--ink-soft);line-height:1.1;padding:4px 2px;text-align:center}
nav button .pill{width:56px;height:34px;border-radius:999px;display:grid;place-items:center;transition:background-color .2s}
nav button.on{color:var(--choi-deep)}
nav button.on .pill{background:#D7EAE1}
nav[hidden]{display:none}

.toast{
  position:fixed;left:16px;right:16px;bottom:calc(var(--nav-h) + 14px);z-index:50;max-width:528px;margin:0 auto;
  background:var(--ink);color:#fff;border-radius:16px;padding:14px 16px;font-size:16px;
  opacity:0;transform:translateY(10px);transition:opacity .25s,transform .25s;pointer-events:none;
}
.toast.on{opacity:1;transform:none}

/* ---------- games ---------- */
.games{display:grid;gap:14px;padding:6px 16px}
.game-entry{
  display:flex;align-items:center;gap:16px;width:100%;min-height:112px;padding:16px 18px;text-align:left;
  background:var(--card);border-radius:var(--r);border:2px solid var(--line);box-shadow:0 2px 0 var(--line);
  transition:transform .15s ease-out;
}
.game-entry:active{transform:scale(.97)}
.game-entry .gi{font-size:44px;line-height:1;flex:none}
.game-entry b{display:block;font-family:var(--serif);font-size:22px;color:var(--choi-deep);line-height:1.2}
.game-entry span span{display:block;font-size:16px;color:var(--ink-soft);margin-top:4px}
.back{display:inline-flex;align-items:center;gap:6px;min-height:48px;padding:0 14px 0 8px;margin:12px 12px 0;border-radius:999px;font-weight:700;color:var(--choi-deep)}
.game-rule{margin:0 16px 12px;display:flex;gap:10px;align-items:flex-start;font-size:16px;color:var(--ink-soft)}
.game-rule svg{flex:none}
.qq-meta{display:flex;justify-content:space-between;align-items:center;padding:0 16px 10px;font-weight:700;color:var(--ink-soft);font-size:15px}
.flip{padding:0 16px;perspective:1200px}
.flip-inner{position:relative;min-height:330px;transform-style:preserve-3d;transition:transform .4s cubic-bezier(.3,.7,.3,1)}
.flip.flipped .flip-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:var(--r);backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.face.front{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;width:100%;color:#fff;
  background:
    linear-gradient(135deg,var(--choi-deep) 25%,transparent 25%) 0 0/48px 48px,
    linear-gradient(225deg,var(--choi-deep) 25%,transparent 25%) 0 0/48px 48px,
    linear-gradient(315deg,var(--anor) 25%,transparent 25%) 24px 0/48px 48px,
    linear-gradient(45deg,var(--anor) 25%,transparent 25%) 24px 0/48px 48px,
    var(--choi);
}
.face.front .open{background:var(--card);color:var(--choi-deep);border-radius:999px;padding:14px 22px;font-weight:800;font-size:19px;box-shadow:0 6px 18px -8px rgba(0,0,0,.5)}
.face.front .q-mark{width:84px;height:84px;border-radius:50%;background:var(--zar);color:var(--choi-deep);display:grid;place-items:center;font-family:var(--serif);font-size:48px;font-weight:700}
.face.back{transform:rotateY(180deg);background:var(--card);display:flex;flex-direction:column;gap:14px;padding:20px;box-shadow:0 8px 24px -14px rgba(19,35,31,.35)}
.flip:not(.flipped) .face.back,.flip.flipped .face.front{pointer-events:none}
.who{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;font-weight:800;font-size:15px}
.who.parent{background:#E3F1EA;color:var(--choi-deep)}
.who.child{background:#FBF0D6;color:#7A5A0B}
.who .e{font-size:22px}
.qtext{font-family:var(--serif);font-size:25px;line-height:1.32;font-weight:600}
.face.back .listen{margin-top:auto;flex:none}
.big-btn{
  display:flex;align-items:center;justify-content:center;gap:10px;width:calc(100% - 32px);margin:16px 16px 0;min-height:60px;
  border-radius:999px;background:var(--choi);color:#fff;font-weight:800;font-size:19px;transition:transform .15s ease-out;
}
.big-btn:active{transform:scale(.97)}
.big-btn.ghost{background:var(--card);color:var(--choi-deep);border:2px solid var(--line)}
.bridge{
  margin:6px 16px 0;padding:22px 20px;border-radius:var(--r);background:var(--choi);color:#fff;text-align:center;
  display:flex;flex-direction:column;gap:14px;align-items:center;animation:rise .35s ease-out both;
}
.bridge .heart{font-size:48px;line-height:1}
.bridge p{font-family:var(--serif);font-size:24px;line-height:1.3;font-weight:600}
.bridge .listen{background:#fff;color:var(--choi-deep);width:100%}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.wx{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.wx button{
  min-height:132px;border-radius:var(--r);background:var(--card);border:2px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:18px;
  transition:transform .2s ease-out,opacity .2s;
}
.wx button .e{font-size:52px;line-height:1;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.wx button.on{border-color:var(--zar);box-shadow:0 0 0 3px var(--zar) inset}
.wx button.on .e{transform:scale(1.18)}
.wx.picked button:not(.on){opacity:.5}
.wx-answer{scroll-margin-top:84px;margin:14px 16px 0;background:var(--card);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:14px;animation:rise .35s ease-out both;box-shadow:0 8px 24px -14px rgba(19,35,31,.35)}
.wx-answer .child-say{font-family:var(--serif);font-size:23px;line-height:1.32;font-weight:600}
.adult{border-left:5px solid var(--zar);background:#F4F7F2;border-radius:12px;padding:12px 14px;font-size:17px}
.adult b{display:block;font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--choi);margin-bottom:4px}
.link-help{display:inline-flex;align-items:center;gap:8px;min-height:48px;color:var(--anor);font-weight:800;text-decoration:underline;padding:0 4px}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .listen.playing::after{opacity:1}
}
@media (min-width:480px){ .card{flex-basis:420px} }
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="brand" id="brand"></div>
    <button class="age-chip" id="ageChip" hidden></button>
    <button class="lang-btn" id="langBtn"></button>
  </div>
  <div class="ikat thin" aria-hidden="true"></div>
</header>

<main>
  <section class="screen" id="s-start"></section>
  <section class="screen" id="s-cards"></section>
  <section class="screen" id="s-told"></section>
  <section class="screen" id="s-games"></section>
  <section class="screen" id="s-gloss"></section>
  <section class="screen" id="s-help"></section>
</main>

<nav id="nav" hidden><div class="row" id="navRow"></div></nav>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* =====================================================================
   CONTENT — all text lives here, separate from logic (О-5).
   Tajik text must be checked by a native speaker.
   audio.tj: paths for human-recorded MP3s (Ф-3). Set AUDIO_READY = true
   once the files are placed into ./audio/.
   ===================================================================== */
const content = {
  ages: ["6-9", "10-13", "14-17"],
  ui: {
    tj: {
      app: "Гуфтугӯ дар хона",
      switchTo: "Русский",
      startQ: "Фарзанди шумо чандсола аст?",
      ageUnit: "сола",
      ageHint: { "6-9": "Хурдсол", "10-13": "Мактаббача", "14-17": "Наврас" },
      privacy: "Мо ҳеҷ чизро дар бораи шумо ва фарзандатон нигоҳ намедорем.",
      tabs: { cards: "Оғози сӯҳбат", told: "Кӯдак гуфт", games: "Бозиҳо", gloss: "Луғат", help: "Кумак" },
      cardsTitle: "Чӣ тавр гапро сар кунем",
      say: "Гӯед",
      listen: "Гӯш кунед",
      stop: "Бас",
      share: "Фиристодан",
      prev: "Пешина", next: "Баъдӣ",
      toldTitle: "Фарзанд мушкилашро гуфт",
      doLabel: "Чӣ кунем", dontLabel: "Чӣ накунем",
      glossTitle: "Калимаҳои нав",
      helpTitle: "Ба куҷо муроҷиат кунем",
      call: "Занг задан",
      helpNote: "Рақамҳо аз манбаъҳои кушод санҷида шудаанд (октябри 2026). Пеш аз намоиш боз санҷед.",
      close: "Пӯшидан",
      tmpVoice: "Овози тоҷикӣ ҳанӯз сабт нашудааст. Ҳоло овози муваққатӣ.",
      noVoice: "Дар ин телефон овоз кор намекунад. Матнро баланд хонед.",
      shared: "Матн нусха шуд"
    },
    ru: {
      app: "Разговор дома",
      switchTo: "Тоҷикӣ",
      startQ: "Сколько лет вашему ребёнку?",
      ageUnit: "лет",
      ageHint: { "6-9": "Малыш", "10-13": "Школьник", "14-17": "Подросток" },
      privacy: "Мы ничего не сохраняем о вас и вашем ребёнке.",
      tabs: { cards: "Начать разговор", told: "Ребёнок рассказал", games: "Игры", gloss: "Словарик", help: "Помощь" },
      cardsTitle: "Как начать разговор",
      say: "Скажите",
      listen: "Прослушать",
      stop: "Стоп",
      share: "Поделиться",

/* ---------------- speech (Ф-3) ---------------- */
let voices = [];
function loadVoices(){ try{ voices = speechSynthesis.getVoices() || [] }catch(e){ voices = [] } }
if ("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
let playingBtn = null, audioEl = null;

function stopAll(){
  if (audioEl){ audioEl.pause(); audioEl = null; }
  try{ if ("speechSynthesis" in window) speechSynthesis.cancel(); }catch(e){}
  if (playingBtn){ setPlaying(playingBtn,false); playingBtn = null; }
}
function setPlaying(btn,on){
  btn.classList.toggle("playing",on);
  btn.setAttribute("aria-pressed", on ? "true" : "false");
  btn.querySelector(".ic").innerHTML = on ? ICON.stop : ICON.play;
  btn.querySelector(".lb").textContent = on ? T().stop : T().listen;
}
function play(btn, text, audioPath){
  if (playingBtn === btn){ stopAll(); return; }
  stopAll();
  playingBtn = btn; setPlaying(btn,true);
  const done = () => { if (playingBtn === btn){ setPlaying(btn,false); playingBtn = null; } };

  // 1) human-recorded MP3 for Tajik (preferred by the ТЗ)
  if (state.lang === "tj" && AUDIO_READY && audioPath){
    audioEl = new Audio(audioPath);
    audioEl.onended = done;
    audioEl.onerror = () => { audioEl = null; synth(text, done); };
    audioEl.play().catch(() => { audioEl = null; synth(text, done); });
    return;
  }
  // 2) browser speech synthesis
  synth(text, done);
}
function synth(text, done){
  if (!("speechSynthesis" in window) || typeof SpeechSynthesisUtterance === "undefined"){
    toast(T().noVoice); done(); return;
  }
  if (!voices.length) loadVoices();
  const starts = p => voices.find(x => (x.lang||"").toLowerCase().replace("_","-").startsWith(p));
  let v = state.lang === "tj" ? starts("tg") : starts("ru");
  if (!v && state.lang === "tj"){
    // browsers rarely ship a Tajik voice: temporary fallback — a Russian voice reads the Cyrillic text
    v = starts("ru");
    if (!v){ toast(T().noVoice); done(); return; }
    toast(T().tmpVoice);
  }
  const u = new SpeechSynthesisUtterance(text);
  if (v){ u.voice = v; u.lang = v.lang; } else { u.lang = "ru-RU"; }
  u.rate = 0.85;
  u.onend = done; u.onerror = done;
  try{ speechSynthesis.speak(u); }catch(e){ toast(T().noVoice); done(); }
}

function shareText(text){
  const full = text + "\n— " + T().app;
  if (navigator.share){ navigator.share({ text: full }).catch(()=>{}); return; }
  if (navigator.clipboard){ navigator.clipboard.writeText(full).then(()=>toast(T().shared)).catch(()=>{}); }
}

let toastTimer;
function toast(msg){
  if (!msg) return;
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on"), 3200);
}

/* ---------------- deck (swipe: native momentum + scroll-snap) ---------------- */
function listenBtn(i){ return `<button class="listen" data-i="${i}" aria-pressed="false"><span class="ic">${ICON.play}</span><span class="lb">${esc(T().listen)}</span></button>`; }
function pager(n){
  let d = ""; for (let i=0;i<n;i++) d += `<span class="dot${i?"":" on"}"></span>`;
  return `<div class="pager"><button class="arrow prev" aria-label="${esc(T().prev)}" disabled>${ICON.left}</button>
    <div class="dots" aria-hidden="true">${d}</div><span class="count">1 / ${n}</span>
    <button class="arrow next" aria-label="${esc(T().next)}">${ICON.right}</button></div>`;
}
function wireDeck(root, items, getText, getAudio, startIdx){
  const deck = root.querySelector(".deck");
  const dots = root.querySelectorAll(".dot");
  const count = root.querySelector(".count");
  const prev = root.querySelector(".prev"), next = root.querySelector(".next");
  const n = items.length;
  const step = () => { const c = deck.children[0]; return c ? c.getBoundingClientRect().width + 12 : 1; };
  let idx = -1, raf = 0;
  const update = () => {
    raf = 0;
    const i = Math.max(0, Math.min(n-1, Math.round(deck.scrollLeft / step())));
    if (i !== idx && idx !== -1) stopAll();
    idx = i; root.dataset.idx = i;
    dots.forEach((d,k) => d.classList.toggle("on", k === i));
    count.textContent = (i+1) + " / " + n;
    prev.disabled = i === 0; next.disabled = i === n-1;
  };
  deck.addEventListener("scroll", () => { if (!raf) raf = requestAnimationFrame(update); }, { passive:true });
  const go = d => {
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    deck.scrollTo({ left: (idx + d) * step(), behavior: reduce ? "auto" : "smooth" });
  };
  prev.onclick = () => go(-1); next.onclick = () => go(1);
  deck.addEventListener("click", e => {
    const b = e.target.closest(".listen");
    if (b){ const i = +b.dataset.i; play(b, getText(items[i]), getAudio(items[i])); return; }
    const s = e.target.closest(".share");
    if (s){ shareText(getText(items[+s.dataset.i])); }
  });
  if (startIdx) deck.scrollLeft = startIdx * step();
  update();
}

          ${listenBtn(0)}
          <div class="adult"><b>${esc(W.adult[L])}</b>${esc(pick.tip[L])}</div>
          ${pick.help ? `<button class="link-help" data-go="help">${ICON.phone}${esc(g.toHelp)}</button>` : ""}
        </div>${bridge}
        <button class="big-btn ghost" data-wx="">${esc(g.again)}</button>` : ""}`;
    if (pick){
      const lb = el.querySelector(".wx-answer .listen");
      lb.onclick = () => play(lb, pick.say[state.lang], null);
      wireBridge(el, g);
    }
  }
}
function wireBridge(el, g){
  const b = el.querySelector(".bridge-listen");
  if (b) b.onclick = () => play(b, content.games.ui[state.lang].bridge, null);
}

const renderers = { start:renderStart, cards:renderCards, told:renderTold, games:renderGames, gloss:renderGloss, help:renderHelp };

function show(screen){
  stopAll();
  state.screen = screen;
  renderers[screen]();
  document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === "s-" + screen));
  renderChrome();
  window.scrollTo(0,0);
}

/* ---------------- events ---------------- */
document.addEventListener("click", e => {
  const age = e.target.closest("[data-age]");
  if (age){ state.age = age.dataset.age; show("cards"); return; }
  const go = e.target.closest("[data-go]");
  if (go){ if (go.dataset.go === "games") state.game = null; show(go.dataset.go); return; }
  const gm = e.target.closest("[data-game]");
  if (gm){
    stopAll();
    state.game = gm.dataset.game || null;
    state.qqIdx = 0; state.qqFlipped = false; state.qqDone = false; state.wxPick = null;
    renderGames(); window.scrollTo(0,0); return;
  }
  const qq = e.target.closest("[data-qq]");
  if (qq){
    const a = qq.dataset.qq;
    if (a === "flip"){
      state.qqFlipped = true;
      $("#qqFlip").classList.add("flipped");
      $("#qqFlip .face.back").setAttribute("aria-hidden","false");
      $('[data-qq="next"]').hidden = false;
      return;
    }
    stopAll();
    if (a === "next"){
      if (state.qqIdx >= content.games.qq.cards.length - 1) state.qqDone = true;
      else { state.qqIdx++; state.qqFlipped = false; }
    }
    if (a === "again"){ state.qqIdx = 0; state.qqFlipped = false; state.qqDone = false; }
    renderGames(); return;
  }
  const wx = e.target.closest("[data-wx]");
  if (wx){
    stopAll(); state.wxPick = wx.dataset.wx || null; renderGames();
    const ans = $("#s-games .wx-answer");
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (ans) ans.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
    else window.scrollTo(0,0);
    return;
  }
  const mode = e.target.closest("[data-mode]");
  if (mode){ stopAll(); const i = +($("#s-told").dataset.idx || 0); state.toldMode = mode.dataset.mode; renderTold(i); return; }
  const term = e.target.closest(".term");
  if (term){ openTerm(term.dataset.g); }
});
$("#langBtn").onclick = () => {
  stopAll();
  state.lang = state.lang === "tj" ? "ru" : "tj";
  store.set("rd-lang", state.lang);
  $("#toast").classList.remove("on");
  const openG = $("#sheet").dataset.g;
  const cur = $("#s-" + state.screen);
  renderers[state.screen](+(cur.dataset.idx || 0));
  renderChrome();
  if (openG) openTerm(openG);
};
$("#ageChip").onclick = () => show("start");
$("#sheetBg").onclick = closeTerm;
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#sheet").classList.contains("on")) closeTerm(); });

show("start");
</script>
</body>
</html>
